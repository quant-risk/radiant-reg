      - main [ref=f23e69]:
        - generic [ref=f23e340]:
          - heading "Instrução Normativa BCB n° 755 de 1/7/2026" [level=2] [ref=f23e341]
          - generic [ref=f23e342]:
            - generic [ref=f23e343]:
              - button "Imprimir" [ref=f23e344] [cursor=pointer]
              - generic [ref=f23e348]:
                - paragraph [ref=f23e349]: INSTRUÇÃO NORMATIVA BCB Nº 755, DE 1º DE JULHO DE 2026
                - paragraph [ref=f23e350]: Altera a Instrução Normativa BCB nº 399, de 29 de junho de 2023, que consolida os procedimentos para remessa de informações sobre o controle da exposição ao risco de liquidez e sobre o indicador Liquidez de Curto Prazo – LCR, de que trata a Resolução BCB nº 207, de 22 de março de 2022, e altera as Instruções de preenchimento e o leiaute do documento de código 2160 - Demonstrativo de Risco de Liquidez – DRL, de que trata a Instrução Normativa BCB nº 399, de 29 de junho de 2023.
                - paragraph [ref=f23e351]:
                  - generic [ref=f23e352]: O Chefe do Departamento de Monitoramento do Sistema Financeiro – Desig, no uso da atribuição que lhe confere o art. 23, inciso I, alínea “a”, do Regimento Interno do Banco Central do Brasil, anexo à Resolução BCB nº 340, de 21 de setembro de 2023, com base no art. 85, inciso I, alínea “b” do referido Regimento, tendo em vista o disposto nas Resoluções BCB ns. 207, de 22 de março de 2022, 436, de 28 de novembro de 2024, e 577, de 23 de junho de 2026,
                - paragraph [ref=f23e353]: "R E S O L V E :"
                - paragraph [ref=f23e354]: "Art. 1º A Instrução Normativa BCB nº 399, de 29 de junho de 2023, publicada no Diário Oficial da União - DOU em 30 de junho de 2023, e retificada no DOU em 21 de julho de 2023, passa a vigorar com as seguintes alterações:"
                - paragraph [ref=f23e355]: “Art. 1º ...................................................................................................................................
                - paragraph [ref=f23e356]: ................................................................................................................................................
                - paragraph [ref=f23e357]: III - a todos os conglomerados prudenciais enquadrados no S1, S2, S3 ou S4, conforme estabelecido na Resolução CMN nº 4.553, de 30 de janeiro de 2017, e na Resolução BCB nº 436, de 28 de novembro de 2024.
                - paragraph [ref=f23e358]: .......................................................................................................................................” (NR)
                - paragraph [ref=f23e359]: “Art. 4º ...................................................................................................................................
                - paragraph [ref=f23e360]: .................................................................................................................................................
                - paragraph [ref=f23e361]: "III - pela líder do conglomerado prudencial, para as instituições integrantes de conglomerado prudencial:"
                - paragraph [ref=f23e362]: a) em base consolidada, nos termos da consolidação adotada para a apuração do Patrimônio de Referência, para as instituições enquadradas nos segmentos S1, S2, S3 e S4; e
                - paragraph [ref=f23e363]: b) em base subconsolidada, no âmbito do subconglomerado prudencial, definido no art. 13-A da Resolução CMN nº 4.950, de 2021, para as instituições enquadradas no S1.” (NR)
                - paragraph [ref=f23e364]: “Art. 5º ...................................................................................................................................
                - paragraph [ref=f23e365]:
                  - generic [ref=f23e366]: "Parágrafo único. Para as instituições integrantes de conglomerado prudencial, as informações de que trata o caput devem ser elaboradas:"
                - paragraph [ref=f23e367]: I - em base consolidada, nos termos da consolidação adotada para a apuração do Patrimônio de Referência; e
                - paragraph [ref=f23e368]: II - em base subconsolidada, no âmbito do subconglomerado prudencial, definido no art. 13-A da Resolução CMN nº 4.950, de 2021.” (NR)
                - paragraph [ref=f23e369]:
                  - generic [ref=f23e370]: “Art. 6º ....................................................................................................................................
                - paragraph [ref=f23e371]: .................................................................................................................................................
                - paragraph [ref=f23e372]: I - pela instituição líder de cada conglomerado prudencial, em base consolidada, em relação às informações das instituições integrantes do conglomerado;
                - paragraph [ref=f23e373]: II - pelos bancos cooperativos, pelas confederações de crédito, pelas confederações de serviço constituídas por cooperativas centrais de crédito ou pelas cooperativas centrais de crédito, em relação às informações da totalidade das cooperativas integrantes de sistemas organizados de três ou dois níveis, em base individual;
                - paragraph [ref=f23e374]: III - pelas instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil não pertencentes a conglomerado prudencial e pelas cooperativas não integrantes de sistema organizado de três ou dois níveis; e
                - paragraph [ref=f23e375]: IV - pela instituição líder de cada conglomerado prudencial, em base subconsolidada, em relação às informações das instituições integrantes do subconglomerado, para as instituições enquadradas no S1.
                - paragraph [ref=f23e376]: ......................................................................................................................................” (NR)
                - paragraph [ref=f23e377]:
                  - generic [ref=f23e378]:
                    - text: Art. 2º Estão disponíveis na página do Banco Central do Brasil na internet, no endereço eletrônico
                    - link "https://www.bcb.gov.br/estabilidadefinanceira/leiautedocumentoscrd" [ref=f23e379] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/leiautedocumentoscrd
                    - text: ", as novas versões das Instruções de Preenchimento e do Leiaute do documento de código 2160 – Demonstrativo de Risco de Liquidez – DRL, modelo I, válidas a partir da data-base de julho de 2026."
                - paragraph [ref=f23e380]: "Art. 3º Foram feitas as seguintes modificações:"
                - paragraph [ref=f23e381]:
                  - generic [ref=f23e382]: "I - nas Instruções de preenchimento: em “Estoque De Ativos Líquidos, Saídas e Entradas de Caixa” - inclusão do subitem 5.1;"
                - paragraph [ref=f23e383]: "II - no Leiaute: no “Anexo 4 - Código do elemento” – inclusão de orientação quanto ao Domínio 81."
                - paragraph [ref=f23e384]: Art. 4º Fica admitido o envio em caráter de homologação das informações elaboradas em base subconsolidada, para o subconglomerado prudencial, nos termos do art. 13-A da Resolução CMN nº 4.950, de 2021, podendo ser substituídas sem penalidade até 31 de dezembro de 2026, conforme disposto no art. 2º da Resolução BCB nº 577, de 23 de junho de 2026.
                - paragraph [ref=f23e385]: Art. 5º Esta Instrução Normativa entra em vigor na data da sua publicação.
                - paragraph [ref=f23e386]: ANDRÉ MAURÍCIO TRINDADE DA ROCHA
                - paragraph [ref=f23e387]:
                  - generic [ref=f23e388]: NOTA
                - paragraph [ref=f23e389]: A Instrução Normativa BCB nº 399, de 29 de junho de 2023, consolida os procedimentos para a remessa de informações sobre o controle da exposição ao risco de liquidez a que estão sujeitas as instituições enquadradas no Segmento 1 - S1, no Segmento 2 - S2, no Segmento 3 - S3 ou no Segmento 4 - S4, e sobre o indicador Liquidez de Curto Prazo - LCR, estrito às instituições pertencentes ao Segmento 1 (S1), no escopo da Resolução BCB nº 207, de 22 de março de 2022, por meio do documento 2160 - Demonstrativo de Risco de Liquidez - DRL.
                - paragraph [ref=f23e390]: 2. A Resolução CMN nº 4.950, de 30 de setembro de 2021, foi alterada pela Resolução CMN nº 5.221, de 30 de maio de 2025, criando, a partir de 1º de julho de 2026, o subconglomerado prudencial, adicionando-lhe o art. 13-A. A Resolução nº 4.401, de 27 de fevereiro de 2015, foi alterada pela Resolução CMN nº 5.222, de 30 de maio de 2025, estabelecendo que, a partir de 1º de julho de 2026, para as instituições pertencentes ao subconglomerado prudencial, o LCR deve ser calculado em base subconsolidada, alterando-lhe o seu art. 5º.
                - paragraph [ref=f23e391]: 3. Diante das citadas alterações normativas, fez-se necessário alterar a Resolução BCB nº 207, de 2022, de maneira a adequar a remessa de informações relativas à exposição ao risco de liquidez e ao LCR, para que as informações que são apuradas e remetidas pelas instituições enquadradas no S1 em base consolidada, nos termos da consolidação adotada para a apuração do Patrimônio de Referência, também sejam apuradas e remetidas em base subconsolidada, no âmbito do subconglomerado prudencial, definido no art. 13-A da Resolução CMN nº 4.950, de 2021, e do art. 5º da Resolução nº 4.401, de 2015.
                - paragraph [ref=f23e392]: "4. Assim, faz-se necessário promover ajustes na Instrução Normativa BCB nº 399, de 2023, de forma a adequá-la aos novos dispostos na Resolução BCB nº 207, de 2022. A presente Instrução Normativa tem por objetivo:"
                - paragraph [ref=f23e393]: I- atualizar a referência normativa à Resolução BCB nº 436, de 28 de novembro de 2024;
                - paragraph [ref=f23e394]: II- incluir o envio das informações correspondentes à exposição ao risco de liquidez e ao LCR, pelas entidades integrantes do S1, em base subconsolidada, no âmbito do subconglomerado prudencial, definido no termos do art. 13-A da Resolução CMN nº 4.950, de 2021;
                - paragraph [ref=f23e395]: III- realizar ajustes de redação para deixar o texto normativa mais claro;
                - paragraph [ref=f23e396]: IV- comunicar a inclusão do subitem 5.1 nas Instruções de preenchimento no DRL – modelo I;
                - paragraph [ref=f23e397]: V- comunicar a inclusão de orientação quanto ao Domínio 81 no Anexo 4 – Código do elemento no Leiaute do DRL, modelo I; e
                - paragraph [ref=f23e398]: VI- informar a possibilidade de envio em caráter de homologação das informações elaboradas em base subconsolidada, nos termos do art. 13-A da Resolução CMN nº 4.950, de 2021, podendo ser substituídas sem penalidade até 31 de dezembro de 2026.
                - paragraph [ref=f23e399]: 5. O Decreto nº 10.411, de 30 de junho de 2020, regulamentou a realização de análise de impacto regulatório - AIR como pré-requisito à edição de ato normativo. Entretanto, referido Decreto, em seu artigo 4º, estabelece as hipóteses de dispensa de realização de AIR.
                - paragraph [ref=f23e400]: "6. A presente Instrução Normativa se enquadra integralmente no inciso II, art. 4º, do referido Decreto: ato normativo destinado a disciplinar direitos ou obrigações definidos em norma hierarquicamente superior que não permita, técnica ou juridicamente, diferentes alternativas regulatórias, no escopo das alterações promovidas na Resolução BCB nº 207, de 2022. Assim, com base no inciso II, do art. 4º, do Decreto nº 10.411, de 2020, entendo que a edição da presente Instrução Normativa dispensa a realização de AIR."
                - paragraph [ref=f23e401]: ANDRÉ MAURÍCIO TRINDADE DA ROCHA
                - paragraph [ref=f23e402]: Chefe do Departamento de Monitoramento do Sistema Financeiro
                - paragraph [ref=f23e403]
                - paragraph [ref=f23e404]
