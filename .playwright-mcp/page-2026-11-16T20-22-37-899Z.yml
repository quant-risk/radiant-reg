        - generic [ref=f6e340]:
          - heading "Instrução Normativa BCB n° 733 de 4/5/2026" [level=2] [ref=f6e341]
          - generic [ref=f6e342]:
            - generic [ref=f6e343]:
              - button "Imprimir" [ref=f6e344] [cursor=pointer]
              - generic [ref=f6e348]:
                - paragraph [ref=f6e349]: INSTRUÇÃO NORMATIVA BCB Nº 733, DE 4 DE MAIO DE 2026
                - paragraph [ref=f6e350]: Altera o leiaute e as instruções de preenchimento do documento de código 3040 - Dados de Risco de Crédito, do Sistema de Informações de Créditos (SCR), de que trata a Carta Circular nº 3.869, de 19 de março de 2018.
                - paragraph [ref=f6e351]:
                  - generic [ref=f6e352]: O Chefe do Departamento de Monitoramento do Sistema Financeiro – Desig, no uso da atribuição que lhe confere o art. 23, inciso I, alínea “a”, do Regimento Interno do Banco Central do Brasil, anexo à Resolução BCB nº 340, de 21 de setembro de 2023, com base no art. 85, inciso I do referido Regimento, tendo em vista o disposto nas Resoluções CMN ns. 4.676, de 31 de julho de 2018, e 5.037, de 29 de setembro de 2022, na Circular nº 3.870, de 19 de dezembro de 2017, na Resolução BCB nº 188, de 23 de fevereiro de 2022, e na Carta Circular nº 3.869, de 19 de março de 2018,
                - paragraph [ref=f6e353]: "R E S O L V E :"
                - paragraph [ref=f6e354]:
                  - generic [ref=f6e355]: Art. 1º Passam a vigorar, a partir das datas-bases especificadas, as novas versões do leiaute e das instruções de preenchimento do documento de código 3040 - Dados de Risco de Crédito, disponíveis na página do Banco Central do Brasil na internet, no endereço eletrônico
                  - link "https://www.bcb.gov.br/estabilidadefinanceira/scrdoc3040" [ref=f6e356] [cursor=pointer]:
                    - /url: https://www.bcb.gov.br/estabilidadefinanceira/scrdoc3040
                  - text: .
                - paragraph [ref=f6e357]: "Art. 2º Foram feitas as seguintes modificações no leiaute do documento 3040, indicadas no documento com a sigla (NR), com vigência a partir da data-base de maio de 2026:"
                - paragraph [ref=f6e358]: "I - Em Doc3040, tabela “h. Informações de Contabilização de Instrumentos Financeiros - Resolução CMN 4.966/2021 (ContInstFinRes4966)”: alteração da descrição do campo “Renda do mês”;"
                - paragraph [ref=f6e359]: "II - Em Anexo 26 - InfosAdicionais:"
                - paragraph [ref=f6e360]: "a) no domínio 03 – Saídas: alteração da descrição do subdomínio 10 para “Cancelamento de contrato ou de limite”;"
                - paragraph [ref=f6e361]: "b) no domínio 04 - Instrumento registrado em sistemas de registro, liquidação e custódia autorizados pelo Banco Central do Brasil: inclusão dos subdomínios:"
                - paragraph [ref=f6e362]: 1. 12, com a descrição “CIP/NUCLEA”;
                - paragraph [ref=f6e363]: 2. 13, com a descrição “TAG IMF”;
                - paragraph [ref=f6e364]: 3. 14, com a descrição “SPC Grafeno”; e
                - paragraph [ref=f6e365]: 4. 15, com a descrição “QS – Quick Soft”;
                - paragraph [ref=f6e366]: "c) no domínio 06 - Ativo vinculado em sistemas de registro, liquidação e custódia autorizados pelo Banco Central do Brasil, inclusão dos subdomínios:"
                - paragraph [ref=f6e367]: 1. 12, com a descrição “CIP/NUCLEA”;
                - paragraph [ref=f6e368]: 2. 13, com a descrição “TAG IMF”;
                - paragraph [ref=f6e369]: 3. 14, com a descrição “SPC Grafeno”; e
                - paragraph [ref=f6e370]: 4. 15, com a descrição “QS – Quick Soft”.
                - paragraph [ref=f6e371]: "Art. 3º Foram feitas as seguintes modificações no leiaute do documento 3040, indicadas no documento com a sigla (NR2), com vigência a partir da data-base de julho de 2026:"
                - paragraph [ref=f6e372]: "I - Em Anexo 26: InfosAdicionais:"
                - paragraph [ref=f6e373]: "a) no domínio 14 – Vinculação Legal e Regulatória: exclusão do subdomínio 05; e"
                - paragraph [ref=f6e374]: "b) no domínio 21 – Empréstimo entre pessoas: inclusão de indicação de Investidor Qualificado;"
                - paragraph [ref=f6e375]: "II - Em Anexo 37: Tipo de Uso Regulatório: inclusão do domínio 12, com a descrição “Operações de crédito imobiliário (Resolução nº 4676/2018 e Resolução BCB nº 188/2022)”; e"
                - paragraph [ref=f6e376]: "III - inclusão dos Anexos:"
                - paragraph [ref=f6e377]: a) 50 - Especificação créditos imobiliário; e
                - paragraph [ref=f6e378]: b) 51 - Complemento crédito imobiliário.
                - paragraph [ref=f6e379]: "Art. 4º Foi feita a seguinte modificação no leiaute do documento 3040, indicada no documento com a sigla (NR3), com vigência a partir da data-base de novembro de 2026:"
                - paragraph [ref=f6e380]: "I - Em Anexo 8: Característica Especial - CaracEspecial: alteração na descrição do domínio 25 para “Limite sujeito à provisão”."
                - paragraph [ref=f6e381]: "Art. 5º Foram feitas as seguintes modificações nas instruções de preenchimento, identificadas pela sigla (NR), com vigência a partir da data-base de maio de 2026:"
                - paragraph [ref=f6e382]:
                  - generic [ref=f6e383]: "I - No Capítulo “D - Informações da Operação” – “4. Informações Adicionais – (tag <Inf>)” - “I. Nos campos “tipo e subtipo da informação” (atributo “Tp”)”:"
                - paragraph [ref=f6e384]: "a) em “c) Saídas”:"
                - paragraph [ref=f6e385]: "1. tabela: alteração da descrição do domínio 0310 para “Saída por cancelamento de contrato ou de limite”;"
                - paragraph [ref=f6e386]: "2. item 10: alteração da descrição do domínio 0310 para “Saída por cancelamento de contrato ou de limite”; e"
                - paragraph [ref=f6e387]: "3. item 11: alteração na descrição do campo Cd da saída por portabilidade de operação - domínio 0311;"
                - paragraph [ref=f6e388]: "b) em “d) Instrumento registrado em sistemas de registro, liquidação e custódia autorizados pelo Banco Central do Brasil”: atualização da tabela de domínio 04 com a Inclusão de subdomínios 12 a 15;"
                - paragraph [ref=f6e389]: "c) em “e) Ativo registrado como lastro”: atualização da tabela de domínio 06 com a Inclusão de subdomínios 12 a 15;"
                - paragraph [ref=f6e390]: "II - No capítulo “I. Instrumentos Financeiros – (novas tags < ContInstFinRes4966 > < Estagio > < Perda >)”:"
                - paragraph [ref=f6e391]: "a) em “h) Rendas do mês”:"
                - paragraph [ref=f6e392]: 1. alteração da descrição; e
                - paragraph [ref=f6e393]: 2. inclusão de contas que devem servir de referência para o registro das “Rendas do mês”;
                - paragraph [ref=f6e394]: "b) em “l): Motivo de alocação no Estágio”:"
                - paragraph [ref=f6e395]: 1. inclusão das observações 3 e 4; e
                - paragraph [ref=f6e396]: 2. inclusão de exemplo.
                - paragraph [ref=f6e397]: "Art. 6º Foram feitas as seguintes modificações nas instruções de preenchimento, identificadas pela sigla (NR2), com vigência a partir da data-base de Julho de 2026:"
                - paragraph [ref=f6e398]:
                  - generic [ref=f6e399]: "I - No Capítulo “D - Informações da Operação” – “4. Informações Adicionais – (tag <Inf>)” - “I. Nos campos “tipo e subtipo da informação” (atributo “Tp”)”:"
                - paragraph [ref=f6e400]: "a) em “j) Vinculação legal e regulatória”:"
                - paragraph [ref=f6e401]: 1. descontinuação do domínio 1405; e
                - paragraph [ref=f6e402]: 2. inclusão de observações relativas ao subdomínio 1408;
                - paragraph [ref=f6e403]: "b) em “p) Empréstimo entre pessoas”: inclusão de indicação de Investidor Qualificado."
                - paragraph [ref=f6e404]: "Art. 7º Foi feita a seguinte modificação nas instruções de preenchimento, identificada pela sigla (NR3), com vigência a partir da data-base de novembro de 2026:"
                - paragraph [ref=f6e405]: "I - No Capítulo “D - Informações da Operação” – “1. Informações Básicas da Operação – (tag <Op>)”:"
                - paragraph [ref=f6e406]:
                  - generic [ref=f6e407]: "a) em “XVIII - No campo “característica especial” (atributo “CaracEspecial”)”:"
                - paragraph [ref=f6e408]: 1. alteração da descrição do domínio 25 para “Limite sujeito à provisão”; e
                - paragraph [ref=f6e409]: 2. alteração do item xxiii para “xxiii. Limites de crédito e créditos a liberar sujeitos à constituição de provisão para perdas esperadas associadas ao risco de crédito”.
                - paragraph [ref=f6e410]: Art. 8º Esta Instrução Normativa entra em vigor na data de sua publicação.
                - paragraph [ref=f6e411]: ANDRÉ MAURÍCIO TRINDADE DA ROCHA
                - paragraph [ref=f6e412]
                - paragraph [ref=f6e413]: NOTA
                - paragraph [ref=f6e414]: O Sistema de Informações de Créditos – SCR é um sistema que tem por objetivo captar informações sobre operações de crédito de clientes de instituições financeiras (somatório de operações de crédito, repasses interfinanceiros, coobrigações, limites e créditos a liberar). O SCR é gerido pelo Banco Central e alimentado mensalmente pelas instituições financeiras, sendo continuamente atualizado de forma a cumprir as funções previstas no art. 2º da Resolução CMN nº 5.037, de 29 de setembro 2022, e nos termos da Circular nº 3.870, de 2017.
                - paragraph [ref=f6e415]: 2. Em 10 de outubro de 2025, o Conselho Monetário Nacional (CMN) e o Banco Central do Brasil, editaram a Resolução CMN nº 5.255 e da Resolução BCB nº 512, alterando, respectivamente, a Resolução CMN nº 4.676, de 31 de julho de 2018, e a Resolução BCB nº 188, de 23 de fevereiro de 2022. Esses normativos promoveram alterações, respectivamente, no modelo de direcionamento dos recursos dos depósitos de poupança e nas regras que disciplinam o recolhimento compulsório sobre essa modalidade de depósito.
                - paragraph [ref=f6e416]: 3. Em relação ao recolhimento compulsório, observo que a Resolução BCB nº 512, de 2025, possibilitou que até 5% dos saldos de depósitos de poupança na modalidade livre, ao serem utilizados para operações de crédito imobiliário, possam ser deduzidos da exigibilidade de recolhimento sobre essa modalidade de depósito. Esse limite de dedução será acrescido de 1,5 ponto percentual ao ano a partir de 2027, até atingir o teto de 20% da base de cálculo. As operações utilizadas para efeito dessa dedução não podem ser computadas para cumprimento do direcionamento dos recursos captados em depósitos de poupança na forma disciplinada pela Resolução nº 4.676, de 2018.
                - paragraph [ref=f6e417]: 4. Com a alteração proposta no SCR, as instituições financeiras deverão informar quais operações serão utilizadas para fins de dedução do recolhimento compulsório dos depósitos de poupança e quais serão computadas para efeito de cumprimento do direcionamento desse tipo de depósito. Isso possibilitará a identificação individual das operações usadas para cada finalidade e contribuirá para a avaliação periódica dos resultados decorrentes das normas que dispõem sobre o direcionamento dos depósitos de poupança, prevista expressamente no art. 26-A da Resolução nº 4.676, de 2018, com a redação dada pela Resolução CMN nº 5.255, de 10 de outubro 2025.
                - paragraph [ref=f6e418]: 5. Adicionalmente, a Resolução CMN nº 5.255, de 2025, estabeleceu que os sistemas de amortização das operações com cláusula de atualização por índice de preços podem incluir componente adicional de amortização destinado a minimizar variações no valor nominal das prestações. Com isso, o CMN buscou propiciar mais segurança para a contratação de operações com cláusula de atualização por índice de preços, assegurando maior previsibilidade aos mutuários quanto aos valores das prestações.
                - paragraph [ref=f6e419]: 6. Com isso fez-se necessária a inclusão de campos específicos no leiaute do documento de código 3040, o que possibilitará verificar o grau de utilização do componente adicional de amortização por parte das instituições reguladas e a evolução das operações de crédito que utilizem esse mecanismo ao longo do tempo, permitindo que se avalie a efetividade da medida adotada pelo CMN e a necessidade de eventuais ajustes na regulamentação.
                - paragraph [ref=f6e420]: 7. Por oportuno, visando aprimorar o monitoramento das operações de empréstimo entre pessoas, está sendo adicionada marcação para informar se o credor dessas operações é ou não investidor qualificado, conforme o artigo 12 da Resolução CVM nº 30, de 11 de maio de 2021.
                - paragraph [ref=f6e421]: "8. Além dos ajustes mencionados nos parágrafos anteriores, foram feitas alterações com vistas a promover ajustes de redação, exclusão de domínios não mais utilizados, além da inclusão de novos sistemas de registro, liquidação e custódia autorizados pelo Banco Central do Brasil, a seguir relacionados:"
                - paragraph [ref=f6e422]: I - CIP/NUCLEA;
                - paragraph [ref=f6e423]: II - TAG IMF”;
                - paragraph [ref=f6e424]: III - SPC Grafeno”; e
                - paragraph [ref=f6e425]: IV - QS – Quick Soft”.
                - paragraph [ref=f6e426]: "9. Em relação à entrada em vigor das alterações de que trata esta IN BCB, após discussões internas e com o mercado, foi acordado o seguinte cronograma:"
                - paragraph [ref=f6e427]: I - a partir de novembro de 2026 – alterações relativas à marcação de limites sujeitos à provisão;
                - paragraph [ref=f6e428]: II - a partir de julho de 2026 – alterações relativas ao crédito imobiliário e investidor qualificado; e
                - paragraph [ref=f6e429]: III - a partir de maiode 2026 – as demais alterações.
                - paragraph [ref=f6e430]: 10. O Decreto nº 10.411, de 30 de junho de 2020, regulamenta a realização de análise de impacto regulatório – AIR como pré-requisito à edição de atos normativos de interesse geral de agentes econômicos. Entretanto, em seu artigo 4º, o referido decreto estabelece as hipóteses de dispensa de realização de AIR. A presente IN BCB se enquadra nas hipóteses previstas nos incisos II - ato normativo destinado a disciplinar direitos ou obrigações definidos em norma hierarquicamente superior que não permita, técnica ou juridicamente, diferentes alternativas regulatórias; V - ato normativo que vise a preservar liquidez, solvência ou higidez (...) b) dos mercados financeiros, de capitais e de câmbio; e IV - ato normativo que vise à atualização ou à revogação de normas consideradas obsoletas, sem alteração de mérito
                - paragraph [ref=f6e431]: 11. Com a edição dos normativos citados no parágrafo 2 não restou alternativa a não ser a alteração do documento de código 3040 para que este pudesse receber as novas informações, permitindo ao Banco Central efetuar um melhor controle de operações de crédito imobiliário, justificando, assim o enquadramento da presente IN BCB no inciso II do art. 4º do Decreto nº 10.411, de 2020. A inclusão de marcação de investidor qualificado visa aprimorar o monitoramento do sistema financeiro, justificando o enquadramento da presente IN BCB no inciso V, alínea “b” do referido Decreto. Por fim, as demais alterações propostas visaram apenas a promover ajustes no leiaute e nas instruções de preenchimento, sem grandes reflexos no documento de código 3040, o que justifica, também, seu enquadramento no inciso IV do art. 4º do referido Decreto.
                - paragraph [ref=f6e432]: 12. Assim, com base no disposto nos parágrafos 10 e 11, entendo que a edição da presente Instrução Normativa está dispensada da realização de análise de impacto regulatório.
                - paragraph [ref=f6e433]:
                  - generic [ref=f6e434]: ANDRÉ MAURÍCIO TRINDADE DA ROCHA
                  - text: Chefe do Departamento de Monitoramento do Sistema Financeiro
