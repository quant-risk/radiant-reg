      - main [ref=f21e69]:
        - generic [ref=f21e340]:
          - heading "Resolução CMN n° 4.956 de 21/10/2021" [level=2] [ref=f21e341]
          - generic [ref=f21e342]:
            - generic [ref=f21e343]:
              - button "Imprimir" [ref=f21e344] [cursor=pointer]
              - generic [ref=f21e346]:
                - paragraph [ref=f21e347]: RESOLUÇÃO CMN Nº 4.956, DE 21 DE OUTUBRO DE 2021
                - paragraph [ref=f21e348]: Estabelece limite máximo para o montante de exposição em ouro, em moeda estrangeira e em operações sujeitas à variação cambial.
                - paragraph [ref=f21e349]: O Banco Central do Brasil, na forma do art. 9º da Lei nº 4.595, de 31 de dezembro de 1964, torna público que o Conselho Monetário Nacional, em sessão realizada em 21 de outubro de 2021, tendo em vista o disposto no art. 4º, incisos VIII e XI, da referida Lei,
                - paragraph [ref=f21e350]:
                  - generic [ref=f21e351]: "R E S O L V E U :"
                - paragraph [ref=f21e352]:
                  - generic [ref=f21e353]: Art. 1º Esta Resolução estabelece o limite máximo para a exposição em ouro, em moeda estrangeira e em operações sujeitas à variação cambial das instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil.
                - paragraph [ref=f21e354]: "Parágrafo único. Não estão sujeitas ao disposto nesta Resolução:"
                - paragraph [ref=f21e355]: I - as administradoras de consórcio e as instituições de pagamento, que devem observar a regulamentação emitida pelo Banco Central do Brasil, no exercício de suas atribuições legais; e
                - paragraph [ref=f21e356]: II - as instituições enquadradas no Segmento 5 (S5), nos termos da Resolução nº 4.553, de 30 de janeiro de 2017.
                - paragraph [ref=f21e357]:
                  - generic [ref=f21e358]: Art. 2º As instituições mencionadas no art. 1º devem observar o limite máximo de 30% (trinta por cento) do seu Patrimônio de Referência (PR), apurado nos termos da Resolução CMN nº 4.955, de 21 de outubro de 2021, para a exposição em ouro, em moeda estrangeira e em operações sujeitas à variação cambial.
                - paragraph [ref=f21e359]:
                  - generic [ref=f21e360]:
                    - text: § 1º O cumprimento do limite de que trata o
                    - strong [ref=f21e361]: caput
                    - text: deve ocorrer permanentemente.
                - paragraph [ref=f21e362]:
                  - generic [ref=f21e363]:
                    - text: § 2º O cumprimento do limite de que trata o
                    - strong [ref=f21e364]: caput
                    - text: deve ocorrer de forma consolidada para as instituições integrantes de um mesmo conglomerado prudencial, nos termos do Padrão Contábil das Instituições Reguladas pelo Banco Central do Brasil (Cosif).
                - paragraph [ref=f21e365]: § 3º Os procedimentos e parâmetros para apuração do valor da exposição em ouro, em moeda estrangeira e em operações sujeitas à variação cambial serão estabelecidos pelo Banco Central do Brasil.
                - paragraph [ref=f21e366]: Art. 3º O Banco Central do Brasil poderá alterar o limite de que trata o art. 2º, observado o valor mínimo de 15% (quinze por cento) e o valor máximo de 75% (setenta e cinco por cento) do PR.
                - paragraph [ref=f21e367]: Art. 4º Os processos e os controles relativos ao limite estabelecido nesta Resolução constituem responsabilidade do diretor para gerenciamento de riscos (CRO), indicado nos termos da Resolução nº 4.557, de 23 de fevereiro de 2017.
                - paragraph [ref=f21e368]: "Art. 5º Ficam revogadas:"
                - paragraph [ref=f21e369]: I - a Resolução nº 3.488, de 29 de agosto de 2007; e
                - paragraph [ref=f21e370]: II - a Resolução nº 4.388, de 18 de dezembro de 2014.
                - paragraph [ref=f21e371]: Parágrafo único. As citações à Resolução nº 3.488, de 2007, passam a ter como referência esta Resolução.
                - paragraph [ref=f21e372]:
                  - generic [ref=f21e373]: Art. 6º Esta Resolução entra em vigor em 3 de janeiro de 2022.
                - paragraph [ref=f21e374]:
                  - generic [ref=f21e375]: Roberto de Oliveira Campos NetoPresidente do Banco Central do Brasil
