              - generic [ref=f1e359]:
                - paragraph [ref=f1e360]: INSTRUÇÃO NORMATIVA BCB Nº 694, DE 23 de dezembro de 2025
                - paragraph [ref=f1e361]: Altera as Instruções de preenchimento e o Leiaute do documento de código 2030 - Documento de Risco Social, Ambiental e Climático (DRSAC), de que trata a Instrução Normativa BCB nº 222, de 28 de dezembro de 2021.
                - paragraph [ref=f1e362]:
                  - generic [ref=f1e363]: O Chefe do Departamento de Monitoramento do Sistema Financeiro – Desig, no uso da atribuição que confere o art. 23, inciso I, alínea “a”, do Regimento Interno do Banco Central do Brasil, anexo à Portaria nº 84.287, de 27 de fevereiro de 2015, com base no art. 85, inciso I, alínea “b”, do referido Regimento, e tendo em vista o disposto na Resolução BCB nº 151, de 6 de outubro de 2021, e na Instrução Normativa BCB nº 222, de 28 de dezembro de 2021,
                - paragraph [ref=f1e364]:
                  - generic [ref=f1e365]: "RESOLVE:"
                - paragraph [ref=f1e366]:
                  - generic [ref=f1e367]:
                    - text: Art. 1º Passam a vigorar, a partir da data-base de dezembro de 2026, as novas versões das Instruções de preenchimento e do Leiaute do documento de código 2030 - Documento de Risco Social, Ambiental e Climático – DRSAC, disponíveis na página do Banco Central do Brasil na internet, no endereço eletrônico
                    - link "https://www.bcb.gov.br/estabilidadefinanceira/leiautedocumentoscrd" [ref=f1e368] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/leiautedocumentoscrd
                    - text: .
                - paragraph [ref=f1e369]: Art. 2º As Instruções de Preenchimento foram reescritas em formato consolidado.
                - paragraph [ref=f1e370]: "Art. 3º Foram feitas as seguintes modificações no Leiaute:"
                - paragraph [ref=f1e371]: "I - na aba Estrutura XML:"
                - paragraph [ref=f1e372]:
                  - generic [ref=f1e373]:
                    - generic [ref=f1e374]: a)
                    - generic [ref=f1e375]: "nas tags “ExpOperCred” e “ExpTVM”:"
                - paragraph [ref=f1e376]:
                  - generic [ref=f1e377]:
                    - generic [ref=f1e378]: "1."
                    - text: inclusão dos atributos “avaliacaoPorFator” e “tipoAnalise”;
                - paragraph [ref=f1e379]:
                  - generic [ref=f1e380]:
                    - generic [ref=f1e381]: "2."
                    - generic [ref=f1e382]: inclusão dos códigos de avaliação “05” a “09” nas tags “RiscSoc”, “RiscAmb”, “RiscClimFis” e “RiscClimTrans”;
                - paragraph [ref=f1e383]:
                  - generic [ref=f1e384]:
                    - generic [ref=f1e385]: "3."
                    - generic [ref=f1e386]: inclusão dos tipos “04”, “05” e “06” na tag “RiscClimFis”;
                - paragraph [ref=f1e387]:
                  - generic [ref=f1e388]:
                    - generic [ref=f1e389]: "4."
                    - generic [ref=f1e390]: substituição da tag “MitRiscClimFis” pela tag “AtenRisc”;
                - paragraph [ref=f1e391]:
                  - generic [ref=f1e392]:
                    - generic [ref=f1e393]: b)
                    - generic [ref=f1e394]: "na tag “ExpCliente”:"
                - paragraph [ref=f1e395]:
                  - generic [ref=f1e396]:
                    - generic [ref=f1e397]: "1."
                    - text: inclusão dos atributos “avaliacaoPorFator” e “tipoAnalise”;
                - paragraph [ref=f1e398]:
                  - generic [ref=f1e399]:
                    - generic [ref=f1e400]: "2."
                    - generic [ref=f1e401]: inclusão dos códigos de avaliação “05” a “09” nas tags “RiscSoc”, “RiscAmb”, “RiscClimFis” e “RiscClimTrans”;
                - paragraph [ref=f1e402]:
                  - generic [ref=f1e403]:
                    - generic [ref=f1e404]: "3."
