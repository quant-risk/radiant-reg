                - paragraph [ref=f1e425]:
                  - generic [ref=f1e426]:
                    - generic [ref=f1e427]: d)
                    - generic [ref=f1e428]: "na tag “DocumentoDRSAC”:"
                - paragraph [ref=f1e429]:
                  - generic [ref=f1e430]:
                    - generic [ref=f1e431]: "1."
                    - generic [ref=f1e432]: inclusão da tag “CarteiraTotal”;
                - paragraph [ref=f1e433]: "II - na aba Leiaute:"
                - paragraph [ref=f1e434]:
                  - generic [ref=f1e435]:
                    - generic [ref=f1e436]: a)
                    - text: "no grupo “Exposição ao Risco da Operação de Crédito”:"
                - paragraph [ref=f1e437]: 1. alteração do nome do grupo para “Exposição ao Risco de Ativos”;
                - paragraph [ref=f1e438]: 2. correção da descrição do campo “Exposição de Ativos”;
                - paragraph [ref=f1e439]: 3. inclusão dos atributos “avaliacaoPorFator” e “tipoAnalise” nos campos “Exposição de Operação de Crédito” e “Exposição de TVM”;
                - paragraph [ref=f1e440]: "b) no grupo “Exposição ao Risco do Cliente”:"
                - paragraph [ref=f1e441]: 1. inclusão dos atributos “avaliacaoPorFator” e “tipoAnalise” no campo “Exposição do Cliente”.
                - paragraph [ref=f1e442]: "c) no grupo “Exposição ao Risco do Setor Econômico do Cliente”:"
                - paragraph [ref=f1e443]: 1. alteração do nome do grupo para “Exposição ao Risco do Setor Econômico”;
                - paragraph [ref=f1e444]: 2. inclusão do atributo “avaliacaoPorFator” no campo “Exposição do Setor”;
                - paragraph [ref=f1e445]: "d) no grupo “Detalhe das Informações”:"
                - paragraph [ref=f1e446]: 1. substituição do campo “Mitigador Risco Climático Físico” pelo novo campo “Atenuante de Risco”;
                - paragraph [ref=f1e447]: "2. alteração do nome dos campos:"
                - paragraph [ref=f1e448]: 2.1. “Agravantes e Mitigadores” para “Referências para análise de risco do cliente”;
                - paragraph [ref=f1e449]: 2.2. “Tipo de Agravantes e Mitigadores” para “Tipo de Referência para Risco do Cliente”;
                - paragraph [ref=f1e450]: 2.3. “Situação de Agravantes e Mitigadores” para “Situação de Referências para Risco do Cliente”;
                - paragraph [ref=f1e451]: 3. inclusão dos campos “Atenuante de Risco” e “Dimensão do atenuante de risco”;
                - paragraph [ref=f1e452]: e) inclusão do novo grupo “Carteira Total” e de seus campos;
                - paragraph [ref=f1e453]: "III - na aba Anexos:"
                - paragraph [ref=f1e454]:
                  - generic [ref=f1e455]:
                    - generic [ref=f1e456]: a)
                    - text: ajustes nas observações dos anexos 06, 07, 08, 09 e 18;
                - paragraph [ref=f1e457]:
                  - generic [ref=f1e458]:
                    - generic [ref=f1e459]: b)
                    - text: "no anexo 08: inclusão dos tipos “04”, “05” e “06”;"
                - paragraph [ref=f1e460]:
                  - generic [ref=f1e461]:
                    - generic [ref=f1e462]: c)
                    - text: "no anexo 09: inclusão dos códigos de avaliação “05” a “09”;"
                - paragraph [ref=f1e463]:
                  - generic [ref=f1e464]:
                    - generic [ref=f1e465]: d)
                    - text: "nos anexos 11 e 17: ajustes nos nomes dos anexos;"
                - paragraph [ref=f1e466]:
                  - generic [ref=f1e467]:
                    - generic [ref=f1e468]: e)
                    - text: "no anexo 16: ajuste no nome do anexo e substituição dos códigos “01”, “02”, “03”, “04”, “05”, “06” e “09” pelos códigos “11”, “12”, “13”, “14” e “15”;"
                - paragraph [ref=f1e469]:
                  - generic [ref=f1e470]:
                    - generic [ref=f1e471]: f)
                    - text: inclusão dos anexos 21 a 26.
                - paragraph [ref=f1e472]:
                  - generic [ref=f1e473]: Art. 4º Esta Instrução Normativa entra em vigor na data de sua publicação.
                - paragraph [ref=f1e474]
                - paragraph [ref=f1e475]: ANDRÉ MAURÍCIO TRINDADE DA ROCHA
                - paragraph [ref=f1e476]: NOTA
                - paragraph [ref=f1e477]: O Documento de Riscos Social, Ambiental e Climático – DRSAC, regulado pela Resolução BCB nº 151, de 6 de outubro de 2021, cujos procedimentos para elaboração e remessa estão definidos na Instrução Normativa BCB nº 222, de 28 de dezembro de 2021, tem por objetivo captar dados relacionados ao risco social, ao risco ambiental e ao risco climático incorridos pela instituição em suas exposições em operações de crédito e a títulos e valores mobiliários, e dos seus respectivos devedores.
                - paragraph [ref=f1e478]: "2. A presente IN BCB traz correções necessárias para tornar as Instruções de Preenchimento e o Leiaute do DRSAC mais precisos, permitindo que as instituições informem avaliações de risco de ativos, clientes e setores de forma mais aderente à sua Política de Responsabilidade Social, Ambiental e Climática – PRSAC. As alterações presentes nessa IN BCB tornam as avaliações de risco mais compatíveis com padrões e taxonomias nacionais e internacionais relacionadas à classificação de impactos sociais, ambientais e climáticos, que incluem:"
                - paragraph [ref=f1e479]: I - campos para informações sobre o total da carteira da instituição ou conglomerado, por dimensão avaliada, tipo de pessoa, tipo de ativo, tipo de carteira, nível de risco e horizonte temporal de análise;
                - paragraph [ref=f1e480]:
                  - generic [ref=f1e481]: II - correção de alguns campos (tags) e atributos do Leiaute; e
                - paragraph [ref=f1e482]: III - formato consolidado e mais conciso para as Instruções de preenchimento.
                - paragraph [ref=f1e483]: "3. O Decreto nº 10.411, de 30 de junho de 2020, regulamenta a realização de análise de impacto regulatório – AIR como pré-requisito à edição de ato normativo. Entretanto, em seu artigo 4º, o referido decreto estabelece as hipóteses de dispensa de realização de AIR. A presente IN BCB se enquadra na dispensa estabelecida no inciso V, alínea “b” - V - ato normativo que vise a preservar liquidez, solvência ou higidez: b) dos mercados financeiros, de capitais e de câmbio."
                - paragraph [ref=f1e484]: 4. Conforme descrito no parágrafo 2, as alterações ora implementadas visam tornar as Instruções de Preenchimento e o Leiaute do DRSAC mais precisos, permitindo que as instituições informem avaliações de risco de ativos, clientes e setores de forma mais aderente à sua Política de Responsabilidade Social, Ambiental e Climática – PRSAC, o que justifica o enquadramento da presente IN BCB na dispensa de realização de AIR prevista na alínea “b” do inciso V do art. 4º do Decreto nº 10.411, de 2020.
                - paragraph [ref=f1e485]: 5. Convém mencionar, por fim, que a proposta de alteração do DRSAC foi objeto de participação social na modalidade consulta dirigida, em dezembro de 2024 e em maio de 2025 e, após análise das sugestões apresentadas, chegou-se ao presente texto.
                - paragraph [ref=f1e486]: 6. Assim, com base no disposto nos parágrafos 3 a 5, entendo que a edição da presente IN BCB está dispensada da realização de AIR.
                - paragraph [ref=f1e487]:
                  - generic [ref=f1e488]: ANDRÉ MAURÍCIO TRINDADE DA ROCHA
                  - text: Chefe do Departamento de Monitoramento do Sistema Financeiro
