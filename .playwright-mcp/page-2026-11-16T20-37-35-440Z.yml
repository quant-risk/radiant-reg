                - generic [ref=f19e218]: Versão vigente, atualizada em 23/5/2025
              - generic [ref=f19e224]:
                - paragraph [ref=f19e225]: RESOLUÇÃO CMN Nº 4.955, DE 21 DE OUTUBRO DE 2021
                - paragraph [ref=f19e226]: Dispõe sobre a metodologia para apuração do Patrimônio de Referência (PR).
                - paragraph [ref=f19e227]: O Banco Central do Brasil, na forma do art. 9º da Lei nº 4.595, de 31 de dezembro de 1964, torna público que o Conselho Monetário Nacional, em sessão realizada em 21 de outubro de 2021, com base nos arts. 4º, incisos VIII e XI, da referida Lei, 20, § 1º, da Lei nº 4.864, de 29 de novembro de 1965, na Lei nº 6.099, de 12 de setembro de 1974, e nos arts. 1º e 12 da Lei Complementar nº 130, de 17 de abril de 2009,
                - paragraph [ref=f19e228]: "R E S O L V E U :"
                - paragraph [ref=f19e229]:
                  - generic [ref=f19e230]: TÍTULO IDISPOSIÇÕES PRELIMINARES
                - paragraph [ref=f19e231]:
                  - generic [ref=f19e232]: CAPÍTULO IDO OBJETO E DO ESCOPO DE APLICAÇÃO
                - paragraph [ref=f19e233]: Art. 1º Esta Resolução estabelece metodologia de cálculo do Patrimônio de Referência (PR) apurado pelas instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil.
                - paragraph [ref=f19e234]: "Parágrafo único. O disposto nesta Resolução não se aplica:"
                - paragraph [ref=f19e235]:
                  - generic [ref=f19e236]:
                    - text: I - às instituições optantes pela metodologia facultativa simplificada para apuração do requerimento mínimo de Patrimônio de Referência Simplificado (PR
                    - subscript [ref=f19e237]: S5
                    - text: ), conforme a Resolução nº 4.606, de 19 de outubro de 2017; e
                - paragraph [ref=f19e238]:
                  - generic [ref=f19e239]: II - às administradoras de consórcio e às instituições de pagamento, que devem observar a regulamentação específica do Banco Central do Brasil, no exercício de suas atribuições legais.
                - paragraph [ref=f19e240]:
                  - generic [ref=f19e241]:
                    - text: II - às administradoras de consórcio, às instituições de pagamento, às sociedades corretoras de títulos e valores mobiliários, às sociedades distribuidoras de títulos e valores mobiliários e às sociedades corretoras de câmbio, que seguirão as normas editadas pelo Banco Central do Brasil no exercício de suas atribuições legais.
                    - link "(Redação dada, a partir de 1º/1/2025, pela Resolução CMN nº 5.194, de 19/12/2024.)" [ref=f19e242] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5194
                - paragraph [ref=f19e243]:
                  - generic [ref=f19e244]: CAPÍTULO IIDAS DEFINIÇÕES
                - paragraph [ref=f19e245]: Art. 2º O PR consiste no somatório do Nível I e do Nível II.
                - paragraph [ref=f19e246]: § 1º O Nível I consiste no somatório do Capital Principal e do Capital Complementar.
                - paragraph [ref=f19e247]: "§ 2º Para fins da apuração do valor do PR, aplicam-se as seguintes definições:"
                - paragraph [ref=f19e248]: I - subsidiária é a entidade integrante de conglomerado, à exceção da instituição líder e de fundo de investimento consolidado; e
                - paragraph [ref=f19e249]: II - participação de não controladores é a parcela do capital da subsidiária não detida, direta ou indiretamente, pela instituição líder do conglomerado.
                - paragraph [ref=f19e250]:
                  - generic [ref=f19e251]: TÍTULO IIDA APURAÇÃO DO PATRIMÔNIO DE REFERÊNCIA
                - paragraph [ref=f19e252]: CAPÍTULO I
                - paragraph [ref=f19e253]: DO PATRIMÔNIO DE REFERÊNCIA DO CONGLOMERADO
                - paragraph [ref=f19e254]: Art. 3º A apuração do PR deve ser realizada em bases consolidadas para as instituições integrantes de um mesmo conglomerado prudencial, nos termos da regulamentação específica.
                - paragraph [ref=f19e255]:
                  - generic [ref=f19e256]:
                    - text: Parágrafo único. A apuração do PR de instituições financeiras e demais instituições autorizadas pelo Banco Central do Brasil integrantes de conglomerado prudencial liderado por instituição de pagamento deve observar a regulamentação aplicável a esse tipo de conglomerado.
                    - link "(Incluído, a partir de 1º/7/2023, pela Resolução CMN nº 5.049, de 25/11/2022.)" [ref=f19e257] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5049
                - paragraph [ref=f19e258]:
                  - generic [ref=f19e259]: CAPÍTULO IIDA APURAÇÃO DO NÍVEL I
                - paragraph [ref=f19e260]:
                  - strong [ref=f19e261]: Seção IDa apuração do Capital Principal
                - paragraph [ref=f19e262]: "Art. 4º O Capital Principal é apurado mediante:"
                - paragraph [ref=f19e263]: "I - a soma dos valores correspondentes:"
                - paragraph [ref=f19e264]: a) ao capital social constituído por quotas, quotas-partes, ou por ações não resgatáveis e sem mecanismos de cumulatividade de dividendos;
                - paragraph [ref=f19e265]: b) às reservas de capital, de reavaliação e de lucros;
                - paragraph [ref=f19e266]:
                  - generic [ref=f19e267]: c) aos ganhos não realizados decorrentes dos ajustes de avaliação patrimonial, com exceção dos previstos na alínea “g”;
                - paragraph [ref=f19e268]:
                  - generic [ref=f19e269]:
                    - text: c) aos ganhos não realizados decorrentes dos ajustes de avaliação patrimonial, com exceção dos previstos nas alíneas “g” e “h”;
                    - link "(Redação dada pela Resolução CMN nº 5.214, de 22/5/2025.)" [ref=f19e270] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5214
                - paragraph [ref=f19e271]: d) às sobras ou lucros acumulados;
                - paragraph [ref=f19e272]:
                  - generic [ref=f19e273]: e) às contas de resultado credoras, com exceção do ajuste previsto na alínea “h”;
                - paragraph [ref=f19e274]:
                  - generic [ref=f19e275]:
                    - text: e) às contas de resultado credoras;
                    - link "(Redação dada, a partir de 1º/1/2023, pela Resolução CMN nº 5.049, de 25/11/2022.)" [ref=f19e276] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5049
                - paragraph [ref=f19e277]: f) ao depósito em conta vinculada admitido para fins de reenquadramento da instituição, nas situações que configurarem desenquadramento nos requerimentos mínimos de capital, nos termos do art. 6º da Resolução nº 4.019, de 29 de setembro de 2011;
                - paragraph [ref=f19e278]:
                  - generic [ref=f19e279]: g) ao saldo do ajuste positivo ao valor de mercado dos instrumentos financeiros derivativos utilizados para hedge de fluxo de caixa; e
                - paragraph [ref=f19e280]:
                  - generic [ref=f19e281]:
                    - generic [ref=f19e282]:
                      - text: g) ao saldo do ajuste positivo ao valor de mercado dos instrumentos financeiros derivativos utilizados para
                      - emphasis [ref=f19e283]: hedge
                      - text: de fluxo de caixa;
                    - link "(Redação dada, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e284] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e285]: h) ao saldo do ajuste positivo ao valor de mercado dos instrumentos financeiros derivativos registrados contabilmente como passivos decorrente de alterações no risco de crédito próprio da instituição, líquido dos efeitos tributários; e
                - paragraph [ref=f19e286]:
                  - generic [ref=f19e287]:
                    - generic [ref=f19e288]: i) ao valor absoluto do ajuste negativo registrado no patrimônio líquido, decorrente da aplicação, em 1º de janeiro de 2025, dos critérios de constituição de provisão para perdas esperadas previstos na Resolução CMN nº 4.966, de 25 de novembro de 2021, e de acordo com os pisos estabelecidos pelo Banco Central do Brasil, observados os percentuais aplicáveis na forma do § 9º; e
                    - link "(Incluída, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e290] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e291]: "II - a dedução dos valores correspondentes:"
                - paragraph [ref=f19e292]:
                  - generic [ref=f19e293]: a) às perdas não realizadas decorrentes dos ajustes de avaliação patrimonial, com exceção dos previstos na alínea “e”;
                - paragraph [ref=f19e294]:
                  - generic [ref=f19e295]:
                    - text: a) às perdas não realizadas decorrentes dos ajustes de avaliação patrimonial, com exceção dos previstos nas alíneas “e” e “f”;
                    - link "(Redação dada pela Resolução CMN nº 5.214, de 22/5/2025.)" [ref=f19e296] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5214
                - paragraph [ref=f19e297]: "b) às ações ou quaisquer outros instrumentos de emissão própria, autorizados a compor o Capital Principal, adquiridos diretamente, indiretamente ou de forma sintética, inclusive por meio de:"
                - paragraph [ref=f19e298]: 1. quotas de fundo de investimento, proporcionalmente à participação destes instrumentos na carteira do fundo;
                - paragraph [ref=f19e299]: 2. entidade assemelhada a instituição financeira ou por entidade não financeira, controladas; ou
                - paragraph [ref=f19e300]: 3. operações com derivativos, inclusive derivativos de índices;
                - paragraph [ref=f19e301]: c) às perdas ou prejuízos acumulados;
                - paragraph [ref=f19e302]:
                  - generic [ref=f19e303]: d) às contas de resultado devedoras, com exceção do ajuste previsto na alínea “f”;
                - paragraph [ref=f19e304]:
                  - generic [ref=f19e305]:
                    - text: d) às contas de resultado devedoras;
                    - link "(Redação dada, a partir de 1º/1/2023, pela Resolução CMN nº 5.049, de 25/11/2022.)" [ref=f19e306] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5049
                - paragraph [ref=f19e307]:
                  - generic [ref=f19e308]:
                    - text: e) ao saldo do ajuste negativo ao valor de mercado dos instrumentos financeiros derivativos utilizados para
                    - strong [ref=f19e309]: hedge
                    - text: de fluxo de caixa;
                - paragraph [ref=f19e310]: f) ao saldo do ajuste negativo ao valor de mercado dos instrumentos financeiros derivativos registrados contabilmente como passivos decorrente de alterações no risco de crédito próprio da instituição, líquido dos efeitos tributários; e
                - paragraph [ref=f19e311]: g) aos ajustes prudenciais enumerados no art. 5º.
                - paragraph [ref=f19e312]:
                  - generic [ref=f19e313]:
                    - text: § 1º Na soma dos valores de que trata o inciso I do
                    - strong [ref=f19e314]: caput
                    - text: "não deve ser considerado o aumento de capital em processo de autorização, com exceção do aumento de capital realizado por meio:"
                - paragraph [ref=f19e315]: I - de incorporação de reservas e de lucros acumulados; e
                - paragraph [ref=f19e316]:
                  - generic [ref=f19e317]:
                    - text: II - do depósito em conta vinculada mencionado no inciso I do
                    - strong [ref=f19e318]: caput
                    - text: ", alínea “f”."
                - paragraph [ref=f19e319]:
                  - generic [ref=f19e320]:
                    - text: § 2º Para fins de apuração dos valores de que tratam o inciso I do
                    - strong [ref=f19e321]: caput
                    - text: ", alínea “g”, e o inciso II do"
                    - strong [ref=f19e322]: caput
                    - text: ", alínea “e”, não devem ser considerados os valores relativos aos ajustes ao valor de mercado dos instrumentos financeiros derivativos utilizados para"
                    - strong [ref=f19e323]: hedge
                    - text: de fluxo de caixa de itens protegidos que não tenham seus ajustes de marcação a mercado registrados contabilmente.
                - paragraph [ref=f19e324]: "§ 3º Não devem ser considerados no Capital Principal:"
                - paragraph [ref=f19e325]: I - os recursos captados mas ainda não integralizados;
                - paragraph [ref=f19e326]: II - as ações para as quais a instituição tenha criado, na emissão, expectativa de resgate, reembolso, amortização, recompra ou cancelamento;
                - paragraph [ref=f19e327]: III - as ações que tiveram sua compra financiada, direta ou indiretamente, pela instituição emissora ou por qualquer entidade do conglomerado; e
                - paragraph [ref=f19e328]: IV - os depósitos de poupança em associações de poupança e empréstimo.
                - paragraph [ref=f19e329]:
                  - generic [ref=f19e330]:
                    - text: § 4º Para fins de apuração dos valores correspondentes ao inciso II do
                    - strong [ref=f19e331]: caput
                    - text: ", alínea “b”, os respectivos valores podem ser calculados considerando a posição líquida entre posições compradas e vendidas, desde que não haja risco de crédito de contraparte nas posições vendidas."
                - paragraph [ref=f19e332]: § 5º Para aquisições indiretas realizadas por meio de operações com índices, inclusive derivativos, a apuração líquida de que trata o § 4º deve considerar apenas a compensação entre posições compradas e vendidas de operações cujo ativo subjacente seja o respectivo índice, existindo ou não risco de crédito de contraparte.
                - paragraph [ref=f19e333]: "§ 6º Para o cálculo da posição líquida mencionada nos §§ 4º e 5º, o prazo efetivo de vencimento residual da posição vendida deve ser:"
                - paragraph [ref=f19e334]: I - igual ou maior que o da posição comprada; ou
                - paragraph [ref=f19e335]: II - superior a 1 (um) ano.
                - paragraph [ref=f19e336]:
                  - generic [ref=f19e337]:
                    - text: § 7º Para fins de apuração dos valores de que tratam o inciso I do
                    - strong [ref=f19e338]: caput
                    - text: ", alínea “h”, e o inciso II do"
                    - strong [ref=f19e339]: caput
                    - text: ", alínea “f”, não devem ser considerados os valores relativos aos ajustes ao valor de mercado dos instrumentos financeiros derivativos registrados contabilmente como passivos avaliados a mercado, nos termos do art. 4º, § 1º, da Resolução nº 4.277, de 31 de outubro de 2013."
                - paragraph [ref=f19e340]:
                  - generic [ref=f19e341]:
                    - text: § 8º O ajuste negativo apurado no dia 1º de janeiro de 2025, mencionado no inciso I, alínea “i”, do
                    - emphasis [ref=f19e342]: caput
                    - text: deve ser líquido de efeitos fiscais e considerar a totalidade dos instrumentos financeiros sujeitos a constituição de provisão para perdas associadas ao risco de crédito, de acordo com a Resolução CMN nº 4.966, de 25 de novembro de 2021.
                    - link "(Incluído, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e343] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e344]:
                  - generic [ref=f19e345]:
                    - text: § 9º O valor de que trata o inciso I, alínea “i”, do
                    - emphasis [ref=f19e346]: caput
                    - text: "deve ser multiplicado por: ."
                    - link "(Incluído, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e347] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e348]:
                  - generic [ref=f19e349]:
                    - text: I - 75% (setenta e cinco por cento), até 31 de dezembro de 2025; .
                    - link "(Incluído, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e350] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e351]:
                  - generic [ref=f19e352]:
                    - text: II - 50% (cinquenta por cento), de 1º de janeiro de 2026 a 31 de dezembro de 2026; .
                    - link "(Incluído, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e353] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e354]:
                  - generic [ref=f19e355]:
                    - text: III - 25% (vinte e cinco por cento), de 1º de janeiro de 2027 a 31 de dezembro de 2027; e .
                    - link "(Incluído, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e356] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e357]:
                  - generic [ref=f19e358]:
                    - text: IV - 0% (zero por cento), a partir de 1º de janeiro de 2028.
                    - link "(Incluído, a partir de 1º/1/2025, pela Resolução CMN nº 5.199, de 23/12/2024.)" [ref=f19e359] [cursor=pointer]:
                      - /url: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=5199
                - paragraph [ref=f19e360]: "Art. 5º Os ajustes prudenciais mencionados no art. 4º, inciso II, alínea “g”, correspondem aos seguintes elementos patrimoniais:"
                - paragraph [ref=f19e361]: I - ágios pagos na aquisição de investimentos com fundamento em expectativa de rentabilidade futura líquidos de passivos fiscais diferidos a eles associados;
                - paragraph [ref=f19e362]: II - ativos intangíveis;
                - paragraph [ref=f19e363]: III - ativos atuariais relacionados a fundos de pensão de benefício definido, líquidos de passivos fiscais diferidos a ele associados aos quais a instituição financeira não tenha acesso irrestrito;
                - paragraph [ref=f19e364]: "IV - nos termos do art. 8º, os investimentos em:"
