                - paragraph [ref=f19e617]:
                  - generic [ref=f19e618]: CAPÍTULO VIDAS OPERAÇÕES ATIVAS VINCULADAS
                - paragraph [ref=f19e619]: Art. 11. Não são elegíveis a compor o PR os recursos entregues ou colocados por terceiros à disposição das instituições mencionadas no art. 1º para fins da realização de operações ativas vinculadas, nos termos da Resolução nº 2.921, de 17 de janeiro de 2002.
                - paragraph [ref=f19e620]:
                  - generic [ref=f19e621]: TÍTULO IIIDOS INSTRUMENTOS QUE PODEM COMPOR O PATRIMÔNIO DE REFERÊNCIA
                - paragraph [ref=f19e622]:
                  - generic [ref=f19e623]: CAPÍTULO IDO NÚCLEO DE SUBORDINAÇÃO
                - paragraph [ref=f19e624]: "Art. 12. O contrato ou documento que amparar a operação de captação mediante instrumentos elegíveis a compor o PR, com exceção dos itens integrantes do capital social, deve conter capítulo específico denominado Núcleo de Subordinação, composto por:"
                - paragraph [ref=f19e625]: I - cláusulas que permitam evidenciar o atendimento dos requisitos para o Capital Principal, Complementar e o Nível II, previstos, respectivamente, nos arts. 14, 15 e 20;
                - paragraph [ref=f19e626]: II - cláusula estabelecendo ser nula qualquer outra, no contrato ou em outro documento, que prejudique o atendimento dos requisitos previstos nos arts. 14, 15 e 20;
                - paragraph [ref=f19e627]: III - cláusula estabelecendo que o aditamento, alteração ou revogação dos termos do Núcleo de Subordinação dependem de prévia autorização do Banco Central do Brasil, nos termos do art. 25; e
                - paragraph [ref=f19e628]: "IV - resumo da operação, contendo as seguintes informações:"
                - paragraph [ref=f19e629]: a) natureza da captação;
                - paragraph [ref=f19e630]: b) valor captado; e
                - paragraph [ref=f19e631]: c) estrutura do fluxo de desembolsos relativos ao pagamento de amortizações e encargos.
                - paragraph [ref=f19e632]:
                  - generic [ref=f19e633]:
                    - text: Parágrafo único. O aditamento, alteração ou revogação dos termos do Núcleo de Subordinação mencionado no
                    - strong [ref=f19e634]: caput
                    - text: somente podem ocorrer quando verificadas condições de negócio que, a critério do Banco Central do Brasil, justifiquem a pretensão da instituição.
                - paragraph [ref=f19e635]: Art. 13. Nas operações de captação cujos termos sejam definidos por mais de um contrato ou documento, o Núcleo de Subordinação deve conter a transcrição de todas as cláusulas dos contratos ou instrumentos acessórios da operação que estabeleçam sua subordinação ao instrumento principal.
                - paragraph [ref=f19e636]:
                  - generic [ref=f19e637]: CAPÍTULO IIDOS INSTRUMENTOS ELEGÍVEIS AO CAPITAL PRINCIPAL
                - paragraph [ref=f19e638]: "Art. 14. As instituições financeiras não sujeitas aos procedimentos estabelecidos na Lei nº 6.024, de 13 de março de 1974, podem compor seu Capital Principal com outros elementos patrimoniais que tenham sido autorizados a compor essa parcela do PR até a entrada em vigor desta Resolução e atendam aos seguintes requisitos:"
                - paragraph [ref=f19e639]: I - ter a sua liquidação subordinada ao pagamento dos demais passivos, na hipótese de dissolução da instituição emissora;
                - paragraph [ref=f19e640]: II - ter os direitos sobre ativos remanescentes no processo de dissolução, observado o disposto no inciso I, proporcionais ao valor emitido;
                - paragraph [ref=f19e641]: III - prever a perpetuidade do principal, a ser liquidado apenas em situações de dissolução da instituição emissora ou de recompras autorizadas pelo Banco Central do Brasil;
                - paragraph [ref=f19e642]: IV - não apresentar cláusulas contratuais que conduzam à expectativa de recompra, resgate ou cancelamento;
                - paragraph [ref=f19e643]: V - prever remuneração integralmente variável, sendo que seu pagamento somente deve ocorrer com recursos provenientes de lucros e reservas de lucros passíveis de distribuição no último período de apuração;
                - paragraph [ref=f19e644]: VI - não prever a obrigatoriedade de remuneração;
                - paragraph [ref=f19e645]: VII - não prever remunerações preferenciais relativamente aos demais elementos patrimoniais autorizados a compor o Patrimônio de Referência (PR);
                - paragraph [ref=f19e646]: VIII - estabelecer sua imediata utilização na compensação de prejuízos apurados pela instituição emissora quando esgotados os lucros acumulados, as reservas de lucros e as reservas de capital;
                - paragraph [ref=f19e647]: IX - não ser considerado como obrigação financeira, na hipótese de dissolução da instituição emissora;
                - paragraph [ref=f19e648]: X - ser classificado como patrimônio líquido segundo os padrões contábeis internacionalmente reconhecidos;
                - paragraph [ref=f19e649]: XI - não ter sua compra financiada, direta ou indiretamente, pela instituição emissora;
                - paragraph [ref=f19e650]: XII - não ser objeto de garantia, seguro ou qualquer outro mecanismo que obrigue ou permita pagamento ou transferência de recursos, direta ou indiretamente, da instituição emissora, de entidade integrante do próprio conglomerado ou de entidade não financeira controlada, para o detentor do instrumento, de forma a comprometer a condição de subordinação expressa neste artigo;
                - paragraph [ref=f19e651]: XIII - ser emitido somente após a aprovação pela assembleia de acionistas da instituição emitente ou de seu conselho de administração, ou de outras pessoas devidamente autorizadas pelos acionistas; e
                - paragraph [ref=f19e652]: XIV - ser divulgado no balanço patrimonial da instituição emitente de forma clara e separada.
                - paragraph [ref=f19e653]:
                  - generic [ref=f19e654]:
                    - text: § 1º Além dos requisitos citados, os elementos mencionados no
                    - strong [ref=f19e655]: caput
                    - text: "também devem:"
                - paragraph [ref=f19e656]: I - ser integralizados em espécie;
                - paragraph [ref=f19e657]: II - prever o resgate ou recompra apenas pelo emissor, condicionado à autorização do Banco Central do Brasil; e
                - paragraph [ref=f19e658]: III - ser adquiridos pela União.
                - paragraph [ref=f19e659]:
                  - generic [ref=f19e660]:
                    - text: § 2º Os instrumentos mencionados no
                    - strong [ref=f19e661]: caput
                    - text: devem ser registrados contabilmente como passivos da instituição emissora e reclassificados como patrimônio líquido para fins de divulgação de suas demonstrações financeiras.
                - paragraph [ref=f19e662]:
                  - generic [ref=f19e663]: CAPÍTULO IIIDOS INSTRUMENTOS ELEGÍVEIS AO CAPITAL COMPLEMENTAR
                - paragraph [ref=f19e664]: "Art. 15. Para compor o Capital Complementar, os instrumentos devem atender aos seguintes requisitos:"
                - paragraph [ref=f19e665]: I - ser nominativos, quando emitidos no Brasil e, quando emitidos no exterior, sempre que a legislação local assim o permitir;
                - paragraph [ref=f19e666]: II - ser integralizados em espécie;
                - paragraph [ref=f19e667]: III - ter caráter de perpetuidade;
                - paragraph [ref=f19e668]: IV - ter o seu pagamento subordinado ao pagamento dos demais passivos da instituição, com exceção do pagamento dos elementos que compõem o Capital Principal, na hipótese de dissolução da instituição emissora;
                - paragraph [ref=f19e669]: V - prever o pagamento de sua remuneração apenas com recursos provenientes de lucros e reservas de lucros passíveis de distribuição no último período de apuração;
                - paragraph [ref=f19e670]: VI - prever a suspensão do pagamento da remuneração que exceder os recursos disponíveis para essa finalidade;
                - paragraph [ref=f19e671]: VII - prever a suspensão do pagamento de remuneração, na mesma proporção da restrição imposta pelo Banco Central do Brasil à distribuição de dividendos ou de outros resultados relativos às ações, quotas ou quotas-partes, elegíveis ao Capital Principal;
                - paragraph [ref=f19e672]: VIII - prever a suspensão do pagamento da remuneração do instrumento nos mesmos percentuais de retenção estabelecidos para o pagamento de dividendos e de juros sobre o capital próprio ou para o pagamento das sobras líquidas apuradas e da remuneração anual às quotas-parte de capital e ao resgate das quotas-partes, no caso de cooperativas de crédito, se a instituição emissora apresentar insuficiência no cumprimento do Adicional de Capital Principal, nos termos da regulamentação específica, ou o pagamento acarretar desenquadramento em relação aos requerimentos mínimos de Capital Principal, Nível I e PR;
                - paragraph [ref=f19e673]: IX - ter o resgate ou a recompra, ainda que realizado indiretamente por intermédio de entidade integrante do próprio conglomerado ou por entidade não financeira controlada, condicionado à autorização do Banco Central do Brasil;
                - paragraph [ref=f19e674]: X - ser resgatáveis apenas por iniciativa do emissor;
                - paragraph [ref=f19e675]: XI - não ser objeto de garantia, seguro ou qualquer outro mecanismo que obrigue ou permita pagamento ou transferência de recursos, direta ou indiretamente, da instituição emissora, de entidade do conglomerado, ou de entidade não financeira controlada, para o detentor do instrumento, de forma a comprometer a condição de subordinação expressa neste artigo;
                - paragraph [ref=f19e676]: XII - não possuir cláusulas que, direta ou indiretamente, alterem o montante originalmente captado, inclusive por meio de acordos que obriguem a instituição emissora a compensar o investidor se um novo instrumento for emitido com melhores condições de remuneração, com exceção dos casos de recompra e resgate previstos no art. 16;
                - paragraph [ref=f19e677]: XIII - não conter cláusulas que tenham previsão de variação das condições de remuneração após a emissão do instrumento, inclusive em função de oscilação da qualidade creditícia da instituição emitente;
                - paragraph [ref=f19e678]: XIV - não ter sua compra financiada, direta ou indiretamente, pela instituição emissora;
                - paragraph [ref=f19e679]: "XV - prever a extinção, permanente e em valor no mínimo correspondente ao saldo computado no Nível I, ou, conforme definido nos §§ 2º e 3º, a conversão do mesmo valor em ações da instituição emissora elegíveis ao Capital Principal, nas seguintes situações:"
                - paragraph [ref=f19e680]: a) divulgação pela instituição emitente, na forma estabelecida pelo Banco Central do Brasil, de que seu Capital Principal está em patamar inferior a 5,125% (cinco inteiros e cento e vinte e cinco milésimos por cento) do montante RWA, apurado na forma estabelecida pela regulamentação específica;
                - paragraph [ref=f19e681]:
                  - generic [ref=f19e682]:
                    - text: b) assinatura de compromisso de aporte para a instituição emitente, caso se configure a exceção prevista no
                    - strong [ref=f19e683]: caput
                    - text: do art. 28 da Lei Complementar nº 101, de 4 de maio de 2000;
                - paragraph [ref=f19e684]: c) decretação, pelo Banco Central do Brasil, de regime de administração especial temporária ou de intervenção na instituição emitente; ou
                - paragraph [ref=f19e685]: d) determinação, pelo Banco Central do Brasil, de extinção ou conversão, segundo critérios estabelecidos em regulamento específico editado pelo Conselho Monetário Nacional;
                - paragraph [ref=f19e686]: XVI - conter cláusula estabelecendo que a ocorrência das situações previstas nos incisos V, VI, VII, VIII, XV e XVIII não será considerada como evento de inadimplemento ou outro fator que gere a antecipação do vencimento de dívidas em qualquer negócio jurídico de que participe a instituição emitente;
                - paragraph [ref=f19e687]: XVII - prever que serão consideradas extintas a remuneração não paga em virtude da cláusula de que trata o inciso V e a remuneração referente ao período da suspensão levada a efeito em virtude do disposto nos incisos VI, VII e VIII; e
                - paragraph [ref=f19e688]: XVIII - conter cláusula prevendo que a extinção ou a conversão referidas no inciso XV não ocorrerão nas hipóteses de revisão ou de republicação de documentos que tenham sido utilizados pela instituição emitente como base para a divulgação da proporção entre o Capital Principal e o montante RWA, prevista no inciso XV, alínea “a”.
                - paragraph [ref=f19e689]: § 1º Na hipótese de emissão no exterior, os instrumentos elegíveis a compor o Capital Complementar devem conter cláusula elegendo foro no qual sejam reconhecidos os requisitos para o instrumento, para dirimir eventuais disputas judiciais.
                - paragraph [ref=f19e690]:
                  - generic [ref=f19e691]:
                    - text: § 2º A conversão mencionada no inciso XV do
                    - strong [ref=f19e692]: caput
                    - text: "deve atender aos seguintes requisitos:"
                - paragraph [ref=f19e693]: I - a instituição emissora deve possuir todas as autorizações internas necessárias para a emissão do instrumento elegível ao Capital Complementar e das ações a serem utilizadas na conversão, inclusive o capital autorizado de que trata o art. 168 da Lei nº 6.404, de 15 de dezembro de 1976, em valor suficiente para abranger eventual aumento de capital decorrente da conversão;
                - paragraph [ref=f19e694]:
                  - generic [ref=f19e695]:
                    - text: II - a conversão em ações deve ocorrer anteriormente ao efetivo ingresso dos recursos referentes à situação prevista na alínea “b” do inciso XV do
                    - strong [ref=f19e696]: caput
                    - text: ; e
                - paragraph [ref=f19e697]: III - na conversão em ações deve ser estabelecido um limite máximo à quantidade de ações a ser entregue ao investidor.
                - paragraph [ref=f19e698]:
                  - generic [ref=f19e699]:
                    - text: § 3º Ao requerer a autorização a que se refere o art. 25, a instituição emissora deve assumir por escrito, perante o Banco Central do Brasil, o compromisso de preservar o limite de capital autorizado de que trata o art. 168 da Lei nº 6.404, de 1976, necessário para eventual conversão dos instrumentos em ações, na forma do inciso XV do
                    - strong [ref=f19e700]: caput
                    - text: e § 2º, inciso I, durante o período em que os créditos representados pelos instrumentos permanecerem exigíveis.
                - paragraph [ref=f19e701]: § 4º O contrato com cláusula de conversão em ações deve prever a extinção permanente da dívida nos casos em que o investidor possa abdicar do direito ao recebimento das ações.
                - paragraph [ref=f19e702]:
                  - generic [ref=f19e703]:
                    - text: § 5º O previsto no inciso XIII do
                    - strong [ref=f19e704]: caput
                    - text: não permite a pactuação de cláusulas que aumentem ou diminuam os juros, que estipulem valores adicionais a serem pagos, ou que alterem de qualquer outra maneira a remuneração do instrumento.
                - paragraph [ref=f19e705]: "Art. 16. Os instrumentos elegíveis a compor o Capital Complementar podem ser emitidos com cláusula de opção de recompra ou resgate pelo emissor, desde que atendidos os seguintes requisitos:"
                - paragraph [ref=f19e706]: I - intervalo mínimo de 5 (cinco) anos entre a data de emissão e a primeira data de exercício de opção de recompra ou resgate;
                - paragraph [ref=f19e707]: II - previsão contratual para que o exercício da opção de recompra ou resgate seja condicionado, na data do exercício, à autorização do Banco Central do Brasil; e
                - paragraph [ref=f19e708]: III - inexistência de características que acarretem a expectativa de que a recompra ou o resgate será exercido.
                - paragraph [ref=f19e709]: "Art. 17. A autorização para recompra ou resgate dos instrumentos autorizados a compor o Capital Complementar pode ser concedida, desde que:"
                - paragraph [ref=f19e710]: I - a instituição emissora cumpra os requerimentos mínimos de Capital Principal, de Nível I e de PR, e atenda ao Adicional de Capital Principal, definidos na regulamentação específica;
                - paragraph [ref=f19e711]: II - a recompra ou resgate não acarrete desenquadramento em relação aos requerimentos e limites ou insuficiência de Adicional de Capital Principal mencionados no inciso I; e
                - paragraph [ref=f19e712]: III - a instituição manifeste ao Banco Central do Brasil a intenção de exercer a opção de recompra ou resgate, observadas as condições estabelecidas nos arts. 18 e 19.
                - paragraph [ref=f19e713]: "Art. 18. A recompra ou o resgate dos instrumentos autorizados a compor o Capital Complementar, ainda que realizado indiretamente por intermédio de entidade do conglomerado ou por entidade não financeira controlada, somente pode ser permitida nas seguintes hipóteses:"
                - paragraph [ref=f19e714]: I - emissão de novos instrumentos elegíveis ao Capital Complementar, em valor equivalente ao dos instrumentos recomprados ou resgatados e em condições pactuadas mais favoráveis; ou
                - paragraph [ref=f19e715]: II - comprovação de condições de negócio que, a critério do Banco Central do Brasil, justifiquem a pretensão da instituição.
                - paragraph [ref=f19e716]: Art. 19. Os prazos e condições estabelecidos para a recompra ou resgate de instrumentos autorizados a compor o Capital Complementar aplicam-se também à resilição do contrato ou documento que amparar a operação de captação.
                - paragraph [ref=f19e717]:
                  - generic [ref=f19e718]: CAPÍTULO IVDOS INSTRUMENTOS ELEGÍVEIS AO NÍVEL II
                - paragraph [ref=f19e719]: "Art. 20. Para compor o Nível II, os instrumentos devem atender aos seguintes requisitos:"
                - paragraph [ref=f19e720]: I - ser nominativos, quando emitidos no Brasil e, quando emitidos no exterior, sempre que a legislação local assim o permitir;
                - paragraph [ref=f19e721]: II - ser integralizados em espécie;
                - paragraph [ref=f19e722]: III - prever intervalo mínimo de 5 (cinco) anos entre a data de emissão e a data de vencimento, não podendo prever o pagamento de amortizações antes de decorrido esse intervalo;
                - paragraph [ref=f19e723]: IV - ter o seu pagamento subordinado ao pagamento dos demais passivos da instituição, com exceção do pagamento dos elementos que compõem o Capital Principal e o Capital Complementar, na hipótese de dissolução da instituição emissora;
                - paragraph [ref=f19e724]: V - ter a recompra ou o resgate antecipado, ainda que realizado indiretamente por intermédio de entidade do conglomerado ou por entidade não financeira controlada, condicionado à autorização do Banco Central do Brasil;
                - paragraph [ref=f19e725]: VI - ser resgatáveis apenas por iniciativa do emissor;
                - paragraph [ref=f19e726]: VII - não ser objeto de garantia, seguro ou qualquer outro mecanismo que obrigue ou permita pagamento ou transferência de recursos, direta ou indiretamente, da instituição emissora, de entidade do conglomerado ou de entidade não financeira controlada, para o detentor do instrumento, de forma a comprometer a condição de subordinação expressa neste artigo;
                - paragraph [ref=f19e727]: VIII - não conter cláusulas que tenham previsão de variação de prazos ou condições de remuneração entre a emissão e o vencimento do instrumento, inclusive em função de oscilação da qualidade creditícia da instituição emissora;
                - paragraph [ref=f19e728]: IX - não ter sua compra financiada, direta ou indiretamente, pela instituição emissora;
                - paragraph [ref=f19e729]: "X - prever a extinção, permanente e em valor no mínimo correspondente ao saldo computado no Nível II, ou, conforme definido nos §§ 2º e 3º, a conversão do mesmo valor em ações da instituição emissora elegíveis ao Capital Principal, nas seguintes situações:"
                - paragraph [ref=f19e730]: a) divulgação pela instituição emitente, na forma estabelecida pelo Banco Central do Brasil, de que seu Capital Principal está em patamar inferior a 4,5% (quatro inteiros e cinco décimos por cento) do montante RWA, apurado na forma estabelecida pela regulamentação específica;
                - paragraph [ref=f19e731]:
                  - generic [ref=f19e732]:
                    - text: b) assinatura de compromisso de aporte para a instituição emitente, caso se configure a exceção prevista no
                    - strong [ref=f19e733]: caput
                    - text: do art. 28 da Lei Complementar nº 101, de 2000;
                - paragraph [ref=f19e734]: c) decretação, pelo Banco Central do Brasil, de regime de administração especial temporária ou de intervenção na instituição emitente; ou
                - paragraph [ref=f19e735]: d) determinação, pelo Banco Central do Brasil, de extinção ou conversão, segundo critérios estabelecidos em regulamento específico editado pelo Conselho Monetário Nacional;
                - paragraph [ref=f19e736]: XI - conter cláusula estabelecendo que a ocorrência das situações previstas nos incisos X e XII não será considerada como evento de inadimplemento ou outro fator que gere a antecipação do vencimento de dívidas em qualquer negócio jurídico de que participe a instituição emitente; e
                - paragraph [ref=f19e737]: XII - conter cláusula prevendo que a extinção ou a conversão referidas no inciso X não ocorrerão nas hipóteses de revisão ou de republicação de documentos que tenham sido utilizados pela instituição emitente como base para a divulgação da proporção entre o Capital Principal e o montante RWA, prevista no inciso X, alínea “a”.
                - paragraph [ref=f19e738]: § 1º Na hipótese de emissão no exterior, os instrumentos elegíveis a compor o Nível II devem conter cláusula elegendo foro no qual sejam reconhecidos os requisitos para o instrumento, para dirimir eventuais disputas judiciais.
                - paragraph [ref=f19e739]:
                  - generic [ref=f19e740]:
                    - text: § 2º A conversão mencionada no inciso X do
                    - strong [ref=f19e741]: caput
                    - text: "deve atender às seguintes condições:"
                - paragraph [ref=f19e742]: I - a instituição emissora deve possuir todas as autorizações internas necessárias para a emissão do instrumento elegível a compor o Nível II e das ações a serem utilizadas na conversão, inclusive o capital autorizado de que trata o art. 168 da Lei nº 6.404, de 1976, em valor suficiente para abranger eventual aumento de capital decorrente da conversão;
                - paragraph [ref=f19e743]:
                  - generic [ref=f19e744]:
                    - text: II - a conversão em ações deve ocorrer anteriormente ao efetivo ingresso dos recursos referentes à situação prevista no inciso X do
                    - strong [ref=f19e745]: caput
                    - text: ", alínea “b”; e"
                - paragraph [ref=f19e746]: III - na conversão em ações deve ser estabelecido um limite máximo à quantidade de ações a ser entregue ao investidor.
                - paragraph [ref=f19e747]:
                  - generic [ref=f19e748]:
                    - text: § 3º Ao requerer a autorização a que se refere o art. 25, a instituição emissora deve assumir por escrito, perante o Banco Central do Brasil, o compromisso de preservar o limite de capital autorizado de que trata o art. 168 da Lei nº 6.404, de 1976, necessário para eventual conversão dos instrumentos em ações, na forma do inciso X do
                    - strong [ref=f19e749]: caput
                    - text: e § 2º, inciso I, durante o período em que os créditos representados pelos instrumentos permanecerem exigíveis.
                - paragraph [ref=f19e750]: § 4º O contrato com cláusula de conversão em ações deve prever a extinção permanente da dívida nos casos em que o investidor possa abdicar do direito ao recebimento das ações.
                - paragraph [ref=f19e751]:
                  - generic [ref=f19e752]:
                    - text: § 5º O previsto no inciso VIII do
                    - strong [ref=f19e753]: caput
                    - text: não permite a pactuação de cláusulas que aumentem ou diminuam os juros, que estipulem valores adicionais a serem pagos, ou que alterem de qualquer outra maneira a remuneração do instrumento.
                - paragraph [ref=f19e754]: "Art. 21. Os instrumentos elegíveis a compor o Nível II podem ser emitidos com cláusula de opção de recompra ou resgate antecipado pelo emissor, desde que atendidos os seguintes requisitos:"
                - paragraph [ref=f19e755]: I - intervalo mínimo de 5 (cinco) anos entre a data de emissão e a primeira data de exercício de opção de recompra ou resgate antecipado;
                - paragraph [ref=f19e756]: II - previsão contratual para que o exercício da opção de recompra ou resgate antecipado seja condicionado, na data do exercício, à autorização do Banco Central do Brasil; e
                - paragraph [ref=f19e757]: III - inexistência de características que acarretem a expectativa de que a recompra ou o resgate antecipado será exercido.
                - paragraph [ref=f19e758]: "Art. 22. A autorização para recompra ou resgate antecipado dos instrumentos autorizados a compor o Nível II pode ser concedida, desde que:"
                - paragraph [ref=f19e759]: I - a instituição emissora cumpra os requerimentos mínimos de Capital Principal, de Nível I e de PR, e atenda ao Adicional de Capital Principal, definidos na regulamentação específica;
                - paragraph [ref=f19e760]: II - a recompra ou resgate não acarrete desenquadramento em relação aos requerimentos e limites ou insuficiência de Adicional de Capital Principal, mencionados no inciso I; e
                - paragraph [ref=f19e761]: III - a instituição manifeste ao Banco Central do Brasil a intenção de exercer a opção de recompra ou resgate, observadas as condições estabelecidas nos arts. 23 e 24.
                - paragraph [ref=f19e762]: "Art. 23. A recompra ou o resgate dos instrumentos autorizados a compor o Nível II, ainda que realizado indiretamente, por intermédio de entidade do conglomerado ou por entidade não financeira controlada, somente pode ser permitido nas seguintes hipóteses:"
                - paragraph [ref=f19e763]: I - emissão de novos instrumentos elegíveis ao Nível II, com prazo efetivo de vencimento maior ou igual ao prazo remanescente dos instrumentos recomprados ou resgatados, em valor equivalente ao desses e em condições pactuadas mais favoráveis; ou
                - paragraph [ref=f19e764]: II - comprovação de condições de negócio que, a critério do Banco Central do Brasil, justifiquem a pretensão da instituição.
                - paragraph [ref=f19e765]: Art. 24. Os prazos e condições estabelecidos para a recompra ou resgate de instrumentos autorizados a compor o Nível II aplicam-se também à resilição do contrato ou documento que amparar a operação de captação.
                - paragraph [ref=f19e766]:
                  - generic [ref=f19e767]: CAPÍTULO VDA AUTORIZAÇÃO PARA O CAPITAL PRINCIPAL, COMPLEMENTAR E PARA O NÍVEL II
                - paragraph [ref=f19e768]: Art. 25. Os valores efetivamente integralizados referentes a instrumentos de capital ou de dívida, com exceção dos itens mencionados no art. 4º, inciso I, somente podem compor o Capital Principal, Complementar e o Nível II mediante autorização do Banco Central do Brasil.
                - paragraph [ref=f19e769]:
                  - generic [ref=f19e770]:
                    - text: § 1º Para fins da autorização mencionada no
                    - strong [ref=f19e771]: caput
                    - text: ", o Núcleo de Subordinação mencionado no art. 12 deve, salvo regramento específico, ser submetido ao Banco Central do Brasil, que considerará, entre outros elementos, a estrutura de pagamentos e, para o Nível II, o prazo de vencimento."
                - paragraph [ref=f19e772]: "§ 2º Para que sejam autorizados a compor o Capital Principal, Complementar e o Nível II, os instrumentos devem:"
                - paragraph [ref=f19e773]: I - ser emitidos por instituição autorizada a funcionar pelo Banco Central do Brasil ou por sua dependência ou subsidiária no exterior, desde que essas últimas não sejam constituídas como sociedade de objeto exclusivo ou entidade de propósito específico, qualquer que seja sua forma jurídica;
                - paragraph [ref=f19e774]: II - possuir, no momento de sua emissão, valor nominal unitário mínimo de R$300.000,00 (trezentos mil reais) ou equivalente em moeda estrangeira;
                - paragraph [ref=f19e775]: III - ser registrados em sistema de registro e de liquidação financeira de ativos autorizado pelo Banco Central do Brasil ou pela Comissão de Valores Mobiliários (CVM); e
                - paragraph [ref=f19e776]: IV - abranger, no registro, os componentes do Núcleo de Subordinação previstos no art. 12.
                - paragraph [ref=f19e777]:
                  - generic [ref=f19e778]: § 3º No caso de instrumentos emitidos no exterior, o pedido de autorização de que trata este artigo deve estar acompanhado de parecer jurídico, emitido por escritório de advocacia habilitado na jurisdição cuja legislação seja aplicável ao instrumento, no qual se ateste, sem ressalvas, a adequação das cláusulas do instrumento à referida legislação.
                - paragraph [ref=f19e779]:
                  - generic [ref=f19e780]: CAPÍTULO VIDA EXTINÇÃO E DA CONVERSÃO DO SALDO DEVEDOR DE INSTRUMENTOS AUTORIZADOS A COMPOR O CAPITAL COMPLEMENTAR E O NÍVEL II
                - paragraph [ref=f19e781]: Art. 26. O Banco Central do Brasil poderá determinar a extinção do saldo devedor de instrumentos autorizados a compor o Capital Complementar ou o Nível II ou a conversão desses instrumentos em ações da instituição emitente, nos termos do art. 11 da Lei nº 12.838, de 9 de julho de 2013, quando considerar a medida necessária para viabilizar a continuidade dessa instituição e, ao mesmo tempo, para mitigar riscos relevantes para o regular funcionamento do sistema financeiro ou do sistema de pagamentos.
                - paragraph [ref=f19e782]: "§ 1º Para os efeitos desta Resolução, caracterizam risco à continuidade da instituição o descumprimento de determinação do Banco Central do Brasil para aumentar os montantes de PR, de Nível I ou de Capital Principal e, simultaneamente, a apuração de ao menos uma das seguintes situações:"
                - paragraph [ref=f19e783]: "I - deterioração material:"
                - paragraph [ref=f19e784]: a) do valor e da liquidez de seus ativos;
                - paragraph [ref=f19e785]: b) do seu estado de solvência; ou
                - paragraph [ref=f19e786]: c) da sua credibilidade, caracterizada por redução significativa do volume de captações; e
                - paragraph [ref=f19e787]: II - elevação do risco de inadimplência da qual resulte o acionamento dos mecanismos de garantia e das salvaguardas das câmaras e dos prestadores de serviços de compensação e liquidação, na forma da legislação específica do Sistema de Pagamentos Brasileiro (SPB).
                - paragraph [ref=f19e788]: "§ 2º Para os efeitos desta Resolução, caracteriza risco relevante ao regular funcionamento do sistema financeiro a possibilidade de descontinuidade da instituição ensejar:"
                - paragraph [ref=f19e789]: I - comprometimento das operações de outras instituições ou segmentos relevantes do mercado que possa gerar incerteza quanto à solidez do sistema financeiro ou do sistema de pagamentos; ou
                - paragraph [ref=f19e790]: II - prejuízo significativo à oferta, em níveis adequados, de serviço considerado essencial ao sistema financeiro ou do sistema de pagamentos.
                - paragraph [ref=f19e791]: § 3º Os instrumentos autorizados a compor o Capital Complementar deverão ter seu saldo devedor extinto ou ser convertidos em ações antes dos instrumentos autorizados a compor o Nível II.
                - paragraph [ref=f19e792]: "§ 4º O Banco Central do Brasil somente poderá determinar:"
                - paragraph [ref=f19e793]: I - a extinção do saldo devedor de instrumento que apresente a cláusula de extinção referida nos arts. 15, inciso XV, ou 20, inciso X, na forma neles estabelecida; ou
                - paragraph [ref=f19e794]: II - a conversão em ações de instrumento que apresente a cláusula de conversão referida nos arts. 15, inciso XV, ou 20, inciso X, na forma neles estabelecida.
                - paragraph [ref=f19e795]: Art. 27. As instituições emitentes de instrumentos autorizados a compor o PR devem elaborar e manter permanentemente atualizado plano de ação para a eventualidade de ocorrência da extinção ou conversão previstas no art. 15, inciso XV, e no art. 20, inciso X.
                - paragraph [ref=f19e796]:
                  - generic [ref=f19e797]:
                    - text: § 1º Do plano de ação referido no
                    - strong [ref=f19e798]: caput
                    - text: "devem constar:"
                - paragraph [ref=f19e799]: I - as medidas a serem tomadas para o cumprimento de eventuais obrigações e outros procedimentos operacionais relacionados ao processo de extinção ou conversão; e
                - paragraph [ref=f19e800]: II - as precauções e os procedimentos necessários para que a extinção ou a conversão possa ocorrer de forma transparente e organizada.
                - paragraph [ref=f19e801]:
                  - generic [ref=f19e802]:
                    - text: § 2º O plano de ação mencionado no
                    - strong [ref=f19e803]: caput
                    - text: deve fazer parte do plano de contingência de capital estabelecido na Resolução nº 4.557, de 23 de fevereiro de 2017.
                - paragraph [ref=f19e804]: "Art. 28. É de responsabilidade do conselho de administração ou, na sua inexistência, da diretoria da instituição emitente de instrumentos elegíveis ao PR:"
                - paragraph [ref=f19e805]: I - dar pleno conhecimento do plano de ação mencionado no art. 27 aos titulares de direitos sobre esses instrumentos; e
                - paragraph [ref=f19e806]:
                  - generic [ref=f19e807]:
                    - text: II - divulgar e informar ao Banco Central do Brasil, segundo procedimentos estabelecidos por essa Autarquia, as situações relativas à extinção ou conversão mencionadas no
                    - strong [ref=f19e808]: caput
                    - text: do art. 26.
                - paragraph [ref=f19e809]:
                  - generic [ref=f19e810]: TÍTULO IVDOS REDUTORES APLICADOS AO PATRIMÔNIO DE REFERÊNCIA
                - paragraph [ref=f19e811]:
                  - generic [ref=f19e812]: CAPÍTULO ÚNICODOS REDUTORES APLICADOS AOS INSTRUMENTOS DE DÍVIDA ELEGÍVEIS AO PATRIMÔNIO DE REFERÊNCIA
                - paragraph [ref=f19e813]: "Art. 29. Sobre os saldos dos instrumentos de capital ou de dívida autorizados a compor o Nível II que tenham prazo de vencimento será aplicado redutor, observado o seguinte cronograma:"
                - paragraph [ref=f19e814]: I - de 20% (vinte por cento), do 60º (sexagésimo) mês ao 49º (quadragésimo nono) mês anterior ao do respectivo vencimento;
                - paragraph [ref=f19e815]: II - de 40% (quarenta por cento), do 48º (quadragésimo oitavo) mês ao 37º (trigésimo sétimo) mês anterior ao do respectivo vencimento;
                - paragraph [ref=f19e816]: III - de 60% (sessenta por cento), do 36º (trigésimo sexto) mês ao 25º (vigésimo quinto) mês anterior ao do respectivo vencimento;
                - paragraph [ref=f19e817]: IV - de 80% (oitenta por cento), do 24º (vigésimo quarto) mês ao 13º (décimo terceiro) mês anterior ao do respectivo vencimento; e
                - paragraph [ref=f19e818]: V - de 100% (cem por cento), nos 12 (doze) meses anteriores ao respectivo vencimento.
                - paragraph [ref=f19e819]: Art. 30. Os instrumentos autorizados a compor o PR antes de 1º de outubro de 2013 não devem ter seus saldos reconhecidos, para fins de cálculo de cada um dos níveis do PR segundo as regras estabelecidas nesta Resolução.
                - paragraph [ref=f19e820]:
                  - generic [ref=f19e821]:
                    - text: Parágrafo único. Os instrumentos mencionados no
                    - strong [ref=f19e822]: caput
                    - text: que atendam aos critérios definidos no art. 15 e aos critérios definidos no art. 20 podem compor, respectivamente, o Capital Complementar e o Nível II de forma integral mediante nova autorização do Banco Central do Brasil.
                - paragraph [ref=f19e823]: "Art. 31. O montante dos recursos dos fundos de que tratam a Lei nº 7.827, de 27 de setembro de 1989, o art. 10 da Lei nº 7.998, de 11 de janeiro de 1990, e a Lei nº 8.036, de 11 de maio de 1990, reconhecido no Nível II fica limitado aos seguintes percentuais, aplicados ao valor desses recursos computado no mencionado nível em 30 de junho de 2018:"
                - paragraph [ref=f19e824]: I - 70% (setenta por cento), a partir de 1º de janeiro de 2022;
                - paragraph [ref=f19e825]: II - 60% (sessenta por cento), a partir de 1º de janeiro de 2023;
                - paragraph [ref=f19e826]: III - 50% (cinquenta por cento), a partir de 1º de janeiro de 2024;
                - paragraph [ref=f19e827]: IV - 40% (quarenta por cento), a partir de 1º de janeiro de 2025;
                - paragraph [ref=f19e828]: V - 30% (trinta por cento), a partir de 1º de janeiro de 2026;
                - paragraph [ref=f19e829]: VI - 20% (vinte por cento), a partir de 1º de janeiro de 2027;
                - paragraph [ref=f19e830]: VII - 10% (dez por cento), a partir de 1º de janeiro de 2028; e
                - paragraph [ref=f19e831]: VIII - 0% (zero por cento), a partir de 1º de janeiro de 2029.
                - paragraph [ref=f19e832]:
                  - generic [ref=f19e833]:
                    - text: § 1º O limite de que trata o
                    - strong [ref=f19e834]: caput
                    - text: não se aplica aos recursos dos mencionados fundos autorizados a compor o Nível II após 2 de agosto de 2018.
                - paragraph [ref=f19e835]:
                  - generic [ref=f19e836]:
                    - text: § 2º Aos recursos sujeitos ao limite estabelecido no
                    - strong [ref=f19e837]: caput
                    - text: não se aplicam os arts. 29 e 30.
                - paragraph [ref=f19e838]:
                  - generic [ref=f19e839]: TÍTULO VDISPOSIÇÕES FINAIS
                - paragraph [ref=f19e840]: Art. 32. A menção a Patrimônio Líquido Ajustado (PLA) em normativos divulgados pelo Banco Central do Brasil, relativos a limites operacionais, refere-se à definição de PR estabelecida nesta Resolução.
                - paragraph [ref=f19e841]:
                  - generic [ref=f19e842]:
                    - text: Parágrafo único. O disposto no
                    - strong [ref=f19e843]: caput
                    - text: não se aplica aos limites mínimos de capital realizado e de patrimônio líquido previstos no Regulamento Anexo II da Resolução nº 2.099, de 17 de agosto de 1994.
                - paragraph [ref=f19e844]: "Art. 33. O Banco Central do Brasil disciplinará os procedimentos a serem observados para:"
                - paragraph [ref=f19e845]: I - obtenção das autorizações previstas nesta Resolução;
                - paragraph [ref=f19e846]: II - divulgação de informações relativas à apuração do PR;
                - paragraph [ref=f19e847]: III - cumprimento do disposto no art. 14, § 2º; e
                - paragraph [ref=f19e848]: IV - cumprimento do disposto no art. 5º, § 10.
                - paragraph [ref=f19e849]:
                  - generic [ref=f19e850]:
                    - text: Parágrafo único. O disposto no
                    - strong [ref=f19e851]: caput
                    - text: não se aplica aos limites mínimos de capital realizado e de patrimônio líquido previstos no Regulamento Anexo II da Resolução nº 2.099, de 1994.
                - paragraph [ref=f19e852]: Art. 34. O Banco Central do Brasil poderá determinar que os valores referentes aos instrumentos autorizados a compor o Capital Principal, Complementar e o Nível II, nos termos dos arts. 14, 15 e 20, sejam desconsiderados para a apuração do PR, caso constatado o não atendimento dos requisitos e condições estabelecidos nesta Resolução.
                - paragraph [ref=f19e853]: "Art. 35. Ficam revogados:"
                - paragraph [ref=f19e854]: I - a Resolução nº 4.192, de 1º de março de 2013;
                - paragraph [ref=f19e855]: II - a Resolução nº 4.278, de 31 de outubro de 2013;
                - paragraph [ref=f19e856]: III - a Resolução nº 4.311, de 20 de fevereiro de 2014;
                - paragraph [ref=f19e857]: IV - a Resolução nº 4.400, de 27 de fevereiro de 2015;
                - paragraph [ref=f19e858]: V - a Resolução nº 4.442, de 29 de outubro de 2015;
                - paragraph [ref=f19e859]: VI - o art. 35 da Resolução nº 4.606, de 19 de outubro de 2017;
                - paragraph [ref=f19e860]: VII - a Resolução nº 4.703, de 19 de dezembro de 2018;
                - paragraph [ref=f19e861]: VIII - o art. 26, inciso II, da Resolução nº 4.721, de 30 de maio de 2019;
                - paragraph [ref=f19e862]: IX - a Resolução nº 4.770, de 19 de dezembro de 2019; e
                - paragraph [ref=f19e863]: X - o art. 1º da Resolução CMN nº 4.851, de 27 de agosto de 2020.
                - paragraph [ref=f19e864]: Art. 36. Esta Resolução entra em vigor em 3 de janeiro de 2022.
                - paragraph [ref=f19e865]:
                  - generic [ref=f19e866]: Roberto de Oliveira Campos NetoPresidente do Banco Central do Brasil
