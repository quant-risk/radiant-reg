              - button "Leiaute de arquivos e base normativa" [ref=f10e395] [cursor=pointer]
              - heading "Fale conosco" [level=3] [ref=f10e396]
              - paragraph [ref=f10e397]:
                - text: Dúvidas e problemas no STA poderão ser tratados pelo help desk do Banco Central no telefone (61) 3414-2156 ou encaminhadas por e-mail para
                - link "suporte.ti@bcb.gov.br" [ref=f10e398] [cursor=pointer]:
                  - /url: mailto:suporte.ti@bcb.gov.br
                - text: .
              - paragraph [ref=f10e399]:
