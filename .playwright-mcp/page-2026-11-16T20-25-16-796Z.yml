            - listitem [ref=f10e68]: "> Sistema de transferência de arquivos - STA"
      - main [ref=f10e69]:
        - generic [ref=f10e341]:
          - heading "Sistema de transferência de arquivos - STA" [level=1] [ref=f10e342]
          - generic [ref=f10e343]:
            - generic [ref=f10e346]:
              - paragraph [ref=f10e347]: O Sistema de Transferência de Arquivos – STA foi instituído pela Carta-Circular 3.588, divulgada no Diário Oficial da União de 19/03/2013.
              - paragraph [ref=f10e348]:
                - text: Esse sistema tem por objetivo permitir o intercâmbio de arquivos digitais com o Banco Central do Brasil, de forma padronizada e segura, por meio de conexões na
                - emphasis [ref=f10e349]: Internet
                - text: ", utilizando o protocolo HTTPS."
              - paragraph
              - heading "Funcionalidades" [level=3] [ref=f10e350]
              - paragraph [ref=f10e351]:
                - text: O STA disponibiliza funcionalidades
                - emphasis [ref=f10e352]: Web
                - text: e
                - emphasis [ref=f10e353]: Web Services
                - text: que permitem o recebimento e envio de arquivos digitais de/para o Banco Central do Brasil, além de consultas.
              - paragraph [ref=f10e354]:
                - text: O STA Web tem o objetivo de permitir que os usuários acessem as funcionalidades do sistema de forma manual, por meio de navegadores de
                - emphasis [ref=f10e355]: Internet
                - text: (
                - emphasis [ref=f10e356]: browsers
                - text: ).
              - paragraph [ref=f10e357]:
                - text: Os
                - emphasis [ref=f10e358]: Web Services
                - text: permitem o uso automatizado do STA por meio de requisições HTTPS.
              - heading "Disponibilidade" [level=3] [ref=f10e359]
              - paragraph [ref=f10e360]: O STA está disponível para transferência de arquivos todos os dias, vinte e quatro horas por dia. Reservam-se ao Banco Central do Brasil os períodos compreendidos entre 0h e 1h de segunda a sábado e entre 0h e 12h00 dos domingos para eventuais manutenções.
              - heading "Autorização de uso" [level=3] [ref=f10e361]
              - paragraph [ref=f10e362]: Para fazer uso do sistema, o usuário deverá estar credenciado no Sisbacen e cadastrado na transação PSTA300, de forma a assegurar que somente usuários autorizados pela própria instituição possam transmitir arquivos em seu nome. Adicionalmente, pode ser exigida a autorização em outro serviço para o envio de determinados tipos de documentos, de modo a garantir maior segurança no envio e busca de informações.
              - paragraph [ref=f10e363]:
                - text: Os másters de cada instituição são responsáveis pelo controle de credenciamento de seus operadores na transação PSTA300. Caso não haja nenhum máster habilitado no ambiente de homologação, a reabilitação de senha deve ser solicitada ao Deinf/Diate por meio da aplicação
                - strong [ref=f10e364]:
                  - link "BC Correio" [ref=f10e365] [cursor=pointer]:
                    - /url: https://bccorreio.bcb.gov.br/bccorreio
                - text: . O remetente, que deve necessariamente ser máster no ambiente de produção, deve informar o email para o qual será enviada a nova senha. Após a verificação de que o solicitante é realmente máster Sisbacen no ambiente de produção, sua senha será alterada e enviada para o email indicado no correio eletrônico.
              - paragraph [ref=f10e366]:
                - text: Mais informações sobre cadastro/credenciamento no Sisbacen podem ser encontradas
                - strong [ref=f10e367]:
                  - link "aqui" [ref=f10e368] [cursor=pointer]:
                    - /url: /acessoinformacao/sisbacen
                - text: .
              - heading "Ambientes" [level=3] [ref=f10e369]
              - paragraph [ref=f10e370]: "O STA trabalha com dois ambientes apartados:"
              - list [ref=f10e371]:
                - listitem [ref=f10e372]: Produção - Acessível por usuário cadastrado no Sisbacen de produção, credenciado na transação PSTA300. Está disponível desde 25/03/2013.
                - listitem [ref=f10e373]:
                  - text: Homologação - Acessível por usuário cadastrado no Sisbacen de homologação, credenciado na transação PSTA300. Disponível desde 02/07/2012 (
                  - emphasis [ref=f10e374]: Web Services
                  - text: ) e 10/09/2012 (STA
                  - emphasis [ref=f10e375]: Web
                  - text: ).
              - heading "Arquivos" [level=3] [ref=f10e376]
              - paragraph [ref=f10e377]:
                - text: A preparação dos arquivos enviados ao Banco Central do Brasil é responsabilidade do remetente e deve seguir, quando for o caso, as regras estabelecidas para cada tipo de arquivo. Exemplos de arquivos que podem ser enviados para o Banco Central do Brasil podem ser encontrados
                - strong [ref=f10e378]:
                  - link "aqui" [ref=f10e379] [cursor=pointer]:
                    - /url: /estabilidadefinanceira/leiautearquivosrsfn
                - text: .
              - paragraph [ref=f10e380]: Os arquivos digitais trafegados pelo STA devem estar compactados no padrão ZIP ou GZ.
              - paragraph [ref=f10e381]: Cada instituição só terá acesso aos arquivos que a ela se destinam.
              - paragraph [ref=f10e382]: A integridade do conteúdo do arquivo é verificada utilizando-se algoritmo de hash, que garante que o conteúdo recebido é o mesmo que foi enviado. O algoritmo de hash utilizado é o SHA-256.
            - generic [ref=f10e384]:
              - heading "Sistema" [level=3] [ref=f10e385]
              - button "Acesso ao STA" [ref=f10e386] [cursor=pointer]
              - button "Acesso ao STA (ambiente de homologação)" [ref=f10e387] [cursor=pointer]
              - heading "Documentos relacionados" [level=3] [ref=f10e388]
