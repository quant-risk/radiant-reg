# CI for Radiant Reg (Plano v3.0 — Rust workspace + backend Go legado).
#
# Jobs:
#   - backend-legacy-checks (ubuntu-latest): placeholder lint, go vet, gofmt nos
#       pacotes ativos, build dos binários cmd/*/ e go test -race nos pacotes ativos.
#       Step obsoleto de contagem Go vs CHANGELOG (Sprint 35) e coverage gates
#       defasados removidos (Etapa 0 do Plano v3.0).
#   - rust-linux (ubuntu-latest): cargo fmt --check, cargo clippy -D warnings,
#       cargo test --workspace e gate arquitetural tests/layers.rs.
#   - rust-windows (windows-latest): cargo check --workspace --all-targets e
#       cargo test --workspace (build nativo Windows; zero musl cross de macOS).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-legacy-checks:
    name: Backend Legacy Checks (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Placeholder lint (SPRINT_*.md)
        run: bash scripts/lint-no-placeholder.sh

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: gofmt check (active packages)
        working-directory: backend
        run: |
          UNFORMATTED=$(gofmt -l \
            cmd \
            internal/audit \
            internal/auditlog \
            internal/canonical \
            internal/db \
            internal/drsac \
            internal/ingest \
            internal/radar \
            internal/secrets \
            internal/senhaws \
            internal/sta \
            internal/tenant)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Files not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✓ active packages gofmt'd"

      - name: Build cmd binaries
        working-directory: backend
        run: |
          set -e
          shopt -s nullglob
          bins=(cmd/*/)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "❌ No cmd/*/ directories found"
            exit 1
          fi
          out_dir=$(mktemp -d)
          trap 'rm -rf "$out_dir"' EXIT
          for dir in "${bins[@]}"; do
            bin=$(basename "$dir")
            echo "Building cmd/$bin..."
            go build -o "$out_dir/$bin" "./cmd/$bin"
          done
          echo "All ${#bins[@]} binaries built OK"

      - name: go test -race (active packages)
        working-directory: backend
        run: |
          go test -race -count=1 \
            ./cmd/... \
            ./internal/audit/... \
            ./internal/auditlog \
            ./internal/canonical \
            ./internal/db \
            ./internal/drsac \
            ./internal/ingest \
            ./internal/radar \
            ./internal/secrets \
            ./internal/senhaws \
            ./internal/sta \
            ./internal/tenant

  rust-linux:
    name: Rust Workspace (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace

      - name: Architectural layer gate (layers.rs)
        working-directory: rust
        run: cargo test -p reg-cli --test layers

  rust-windows:
    name: Rust Workspace (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo check --workspace --all-targets
        working-directory: rust
        run: cargo check --workspace --all-targets

      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace

      - name: Architectural layer gate (layers.rs)
        working-directory: rust
        run: cargo test -p reg-cli --test layers
